---
- name: Configure ONTAP AutoSupport
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (prior_config | string | trim)
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Discover ONTAP cluster nodes
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - cluster/nodes
        fields:
          - name
      register: node_info
      no_log: true

    - name: Read AutoSupport
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - support/autosupport
        fields:
          - node
          - mail_hosts
          - from
          - to
          - transport
          - proxy_url
          - contact_support
          - enabled
      register: autosupport_info

    - name: Build AutoSupport lists
      ansible.builtin.set_fact:
        node_list: >-
          {{
            node_info.ontap_info.cluster_nodes.records
            | default([])
            | map(attribute='name')
            | list
          }}
        mail_host_list: "{{ autosupport_mail_hosts.split(',') | map('trim') | reject('equalto', '') | list }}"
        to_address_list: "{{ autosupport_to_addresses.split(',') | map('trim') | reject('equalto', '') | list }}"
        autosupport_records: >-
          {{
            (autosupport_info.ontap_info.support_autosupport | default({})).records
            | default([autosupport_info.ontap_info.support_autosupport | default({})])
          }}

    - name: Validate AutoSupport inputs
      ansible.builtin.assert:
        that:
          - node_list | length > 0
          - mail_host_list | length > 0
          - to_address_list | length > 0
          - autosupport_from_address | default('') | length > 0
        fail_msg: >-
          AutoSupport needs mail hosts, a from address, and at least one to
          address. The cluster also has to return its node names.

    - name: Record AutoSupport for each node
      ansible.builtin.set_fact:
        live_value: "{{ (live_value | default([])) + [row] }}"
        applied_value: "{{ (applied_value | default([])) + [desired] }}"
      vars:
        node_records: >-
          {{
            autosupport_records
            | selectattr('node.name', 'defined')
            | selectattr('node.name', 'equalto', item)
            | list
          }}
        source_record: "{{ (node_records | first) if (node_records | length > 0) else (autosupport_records | first | default({})) }}"
        support_flag: >-
          {{
            source_record.contact_support
            | default(source_record.enabled | default(false))
          }}
        current_proxy: "{{ source_record.proxy_url | default('') | string | trim }}"
        row:
          node: "{{ item }}"
          mail_hosts: "{{ source_record.mail_hosts | default([]) | map('string') | map('trim') | reject('equalto', '') | sort }}"
          from: "{{ source_record['from'] | default('') | string | trim }}"
          to: "{{ source_record.to | default([]) | map('string') | map('trim') | reject('equalto', '') | sort }}"
          transport: "{{ source_record.transport | default('') | string | trim | lower }}"
          support: "{{ 'true' if (support_flag | bool) else 'false' }}"
          proxy_url: "{{ current_proxy }}"
        desired:
          node: "{{ item }}"
          mail_hosts: "{{ mail_host_list | sort }}"
          from: "{{ autosupport_from_address | string | trim }}"
          to: "{{ to_address_list | sort }}"
          transport: https
          support: "true"
          proxy_url: "{{ autosupport_proxy_url | string | trim if (autosupport_proxy_url | default('') | length > 0) else current_proxy }}"
      loop: "{{ node_list | sort }}"
      loop_control:
        label: "{{ item }}"

    - name: Record whether AutoSupport still needs to change
      ansible.builtin.set_fact:
        changed_now: "{{ live_value != applied_value }}"
        keep_original: >-
          {{
            (incoming_prior.changed | default(false) | bool)
            and (
              (live_value != applied_value)
              or (
                (incoming_prior.applied is defined)
                and (live_value == incoming_prior.applied)
              )
            )
          }}

    - name: Configure AutoSupport
      netapp.ontap.na_ontap_autosupport:
        mail_hosts: "{{ mail_host_list }}"
        node_name: "{{ item }}"
        to_addresses: "{{ to_address_list }}"
        from_address: "{{ autosupport_from_address }}"
        proxy_url: "{{ autosupport_proxy_url if autosupport_proxy_url | default('') | length > 0 else omit }}"
        transport: https
        support: true
        state: present
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: "{{ node_list }}"

    - name: Keep the earlier AutoSupport values when this launch did not find a new change
      ansible.builtin.set_fact:
        prior_export:
          changed: true
          previous: "{{ incoming_prior.previous }}"
          applied: "{{ applied_value }}"
      when: keep_original | bool

    - name: Record the AutoSupport values from this launch
      ansible.builtin.set_fact:
        prior_export:
          changed: "{{ changed_now | bool }}"
          previous: "{{ live_value }}"
          applied: "{{ applied_value }}"
      when: not (keep_original | bool)

    - name: Export the recorded AutoSupport change
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ prior_export | to_json }}"
