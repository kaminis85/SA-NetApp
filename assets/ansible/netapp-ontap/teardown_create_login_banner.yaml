---
# Undo of create_login_banner.yaml: clear the cluster login banner when it
# still matches the banner from the form. Safe to run twice.
- name: Clear the ONTAP cluster login banner
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_rest_cli:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
    netapp.ontap.na_ontap_login_messages:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
  vars:
    banner_requested: "{{ cluster_login_banner | default('') | string }}"

  tasks:

    - name: Note that no login banner was named
      ansible.builtin.debug:
        msg: No cluster login banner was named, so End leaves it unchanged.
      when: banner_requested | trim | length == 0

    - name: Stop when no login banner was named
      when: banner_requested | trim | length == 0
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Read the cluster login banner
      netapp.ontap.na_ontap_rest_cli:
        command: security/login/banner
        verb: GET
      register: banner_show

    - name: Record the login banner
      ansible.builtin.set_fact:
        live_value: >-
          {{
            (
              (banner_show.msg.records | default([banner_show.msg | default({})]) | first | default({})).message
              | default('')
            ) | string
          }}

    - name: Note that the banner no longer matches the form
      ansible.builtin.debug:
        msg: The cluster login banner no longer matches the form, so End leaves it unchanged.
      when: live_value != banner_requested

    - name: Stop when the banner no longer matches the form
      when: live_value != banner_requested
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Clear the cluster login banner
      netapp.ontap.na_ontap_login_messages:
        banner: ""

    - name: Report the cleared login banner
      ansible.builtin.debug:
        msg: Cleared the cluster login banner.
