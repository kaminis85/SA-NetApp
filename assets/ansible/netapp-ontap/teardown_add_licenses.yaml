---
# Undo of add_licenses.yaml: remove license packages named in the NetApp
# license file. A legacy key does not include the package name, so End leaves
# those packages installed. The base package is never removed. Safe to run twice.
- name: Remove ONTAP licenses named in the license file
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_license:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
  vars:
    nlf_text: "{{ nlf_license_content | default('') | string }}"
    legacy_text: "{{ legacy_license_keys | default('') | string | trim }}"

  tasks:

    - name: Read package names from the license file
      ansible.builtin.set_fact:
        nlf_packages: >-
          {{
            (
              nlf_text | regex_findall('(?i)"package"\s*:\s*"([^"]+)"')
              + nlf_text | regex_findall('(?i)<package>([^<]+)</package>')
            )
            | map('trim')
            | reject('equalto', '')
            | unique
            | reject('equalto', 'base')
            | list
          }}
        nlf_serials: >-
          {{
            (
              nlf_text | regex_findall('(?i)"serialNumber"\s*:\s*"([^"]+)"')
              + nlf_text | regex_findall('(?i)<serialNumber>([^<]+)</serialNumber>')
            )
            | map('trim')
            | reject('equalto', '')
            | unique
            | list
          }}

    - name: Note that the license file does not name a package
      ansible.builtin.debug:
        msg: >-
          {{
            'Legacy license keys do not name the package, so End leaves those licenses installed.'
            if (legacy_text | length > 0)
            else 'No license file named a package, so End leaves licenses installed.'
          }}
      when: nlf_packages | length == 0

    - name: Stop when no package was named
      when: nlf_packages | length == 0
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Remove the license packages
      netapp.ontap.na_ontap_license:
        state: absent
        license_names:
          - "{{ item }}"
        serial_number: "{{ nlf_serials[0] if (nlf_serials | length == 1) else omit }}"
      loop: "{{ nlf_packages }}"
      loop_control:
        label: "{{ item }}"
      register: license_delete
      failed_when: false

    - name: Confirm the license packages were removed
      ansible.builtin.assert:
        that:
          - not (item.failed | default(false))
        fail_msg: >-
          Removing license {{ item.item }} failed:
          {{ item.msg | default('') }}
      loop: "{{ license_delete.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Report the removed license packages
      ansible.builtin.debug:
        msg: "Removed license packages {{ nlf_packages | join(', ') }}."
