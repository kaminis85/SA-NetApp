---
# Aggregate names come from the node configuration table.
# The SVM is created in the IPspace from Network Configuration.
# Protocols are nfs, iscsi, or both.
# nfs starts NFSv3 and NFSv4.1 and disables UDP.
# iscsi starts the iSCSI service.
# The job schedule drives the load-sharing SnapMirror of the SVM root volume.
# Mirrors are placed on aggregates that are not on the root volume's node.
# The SVM management LIF is four fields: svm_mgmt_lif_name,
# svm_mgmt_lif_address, svm_mgmt_lif_netmask, and svm_mgmt_lif_gateway.
# One SVM has one management LIF, so each value is its own field.
# Blank svm_mgmt_lif_name, svm_mgmt_lif_address, or svm_mgmt_lif_netmask
# skips the LIF. A blank interface group name, in-band management VLAN
# name, or VLAN ID also skips the LIF.
# The LIF is created only when the SVM name, svm_mgmt_lif_name,
# svm_mgmt_lif_address, and svm_mgmt_lif_netmask are set, and the interface
# group and in-band management VLAN are set.
# The default route is created only when that LIF is created and
# svm_mgmt_lif_gateway is set. A blank gateway skips the route. Skipping
# the LIF skips the route as well.
# Each check runs immediately before the task that uses that value.
# SVM name, IPspace, protocols, and aggregate names are checked before
# the SVM is created. Node names are checked when the root volume node
# is matched. Job schedule checks run with the schedule, after the SVM
# exists. LIF, route, and DNS checks run with those tasks.
# The LIF is created on the node that hosts the SVM root volume.
# Its home port is the in-band management VLAN, <interface group>-<VLAN ID>.
# svm_mgmt_lif_gateway is the SVM default route.
# SVM DNS is svm_dns_servers and svm_dns_domain.
# Fill in both to configure DNS on the SVM. Leave both blank to skip it.
# Set only one and SVM DNS fails after the SVM, the LIF, and the route.
# DNS runs after the SVM management LIF and the default route.
# NVMe and S3 are not configured here.
- name: Configure the ONTAP SVM
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    svm_name_normalized: "{{ svm_name | default('') | string | trim }}"
    ipspace_name_normalized: "{{ ipspace_name | default('') | string | trim }}"
    job_name_normalized: "{{ job_name | default('') | string | trim }}"
    job_minutes_normalized: "{{ job_minutes | default('') | string | trim }}"
    vsadmin_password_normalized: "{{ vsadmin_password | default('') | string }}"
    svm_login_banner_normalized: "{{ svm_login_banner | default('') | string | trim }}"
    ifgrp_name_normalized: "{{ ifgrp_name | default('') | string | trim | lower }}"
    ib_mgmt_vlan_name_normalized: "{{ ib_mgmt_vlan_name | default('') | string | trim }}"
    ib_mgmt_vlan_id_normalized: "{{ ib_mgmt_vlan_id | default('') | string | trim }}"
    svm_mgmt_lif_plan:
      lif_name: "{{ svm_mgmt_lif_name | default('') | string | trim }}"
      address: "{{ svm_mgmt_lif_address | default('') | string | trim }}"
      netmask: "{{ svm_mgmt_lif_netmask | default('') | string | trim }}"
      gateway: "{{ svm_mgmt_lif_gateway | default('') | string | trim }}"
    svm_dns_domain_normalized: "{{ svm_dns_domain | default('') | string | trim }}"
    svm_dns_servers_normalized: "{{ svm_dns_servers | default('') | string | trim }}"
    svm_dns_server_list: >-
      {{
        svm_dns_servers_normalized.split(',')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
    svm_dns_requested: >-
      {{
        svm_dns_domain_normalized | length > 0
        or svm_dns_server_list | length > 0
      }}
    svm_dns_ready: >-
      {{
        svm_dns_domain_normalized | length > 0
        and svm_dns_server_list | length > 0
      }}
    svm_mgmt_lif_requested: >-
      {{
        svm_mgmt_lif_plan.lif_name | length > 0
        and svm_mgmt_lif_plan.address | length > 0
        and svm_mgmt_lif_plan.netmask | length > 0
        and ifgrp_name_normalized | length > 0
        and ib_mgmt_vlan_name_normalized | length > 0
        and ib_mgmt_vlan_id_normalized | length > 0
      }}
    svm_mgmt_route_requested: >-
      {{
        svm_mgmt_lif_plan.lif_name | length > 0
        and svm_mgmt_lif_plan.address | length > 0
        and svm_mgmt_lif_plan.netmask | length > 0
        and ifgrp_name_normalized | length > 0
        and ib_mgmt_vlan_name_normalized | length > 0
        and ib_mgmt_vlan_id_normalized | length > 0
        and svm_mgmt_lif_plan.gateway | length > 0
      }}
    ipv4_pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
    ipv4_netmasks:
      - 255.0.0.0
      - 255.128.0.0
      - 255.192.0.0
      - 255.224.0.0
      - 255.240.0.0
      - 255.248.0.0
      - 255.252.0.0
      - 255.254.0.0
      - 255.255.0.0
      - 255.255.128.0
      - 255.255.192.0
      - 255.255.224.0
      - 255.255.240.0
      - 255.255.248.0
      - 255.255.252.0
      - 255.255.254.0
      - 255.255.255.0
      - 255.255.255.128
      - 255.255.255.192
      - 255.255.255.224
      - 255.255.255.240
      - 255.255.255.248
      - 255.255.255.252
    node_rows: >-
      {{
        [] if (node_specs | default('[]') | string | trim) in ['', '[]']
        else (node_specs | from_json if node_specs is string else node_specs)
      }}
    raw_protocols: "{{ allowed_protocols | default('[]') }}"
    decoded_protocols: >-
      {{
        [] if (raw_protocols | string | trim) in ['', '[]']
        else (
          raw_protocols | from_json
          if raw_protocols is string and (raw_protocols | string | trim) is match('^\\[')
          else (
            raw_protocols if raw_protocols is not string
            else raw_protocols.split(',')
          )
        )
      }}
    protocol_list: >-
      {{
        decoded_protocols
        | map('string')
        | map('trim')
        | map('lower')
        | reject('equalto', '')
        | unique
        | list
      }}
    job_minute_tokens: >-
      {{
        job_minutes_normalized.split(',')
        | map('trim')
        | reject('equalto', '')
        | list
      }}

  tasks:

    - name: Note that the SVM name is blank
      ansible.builtin.debug:
        msg: The SVM name is blank, so SVM configuration was skipped.
      when: svm_name_normalized | length == 0

    - name: Stop when the SVM name is blank
      ansible.builtin.meta: end_play
      when: svm_name_normalized | length == 0

    - name: Normalize node rows
      ansible.builtin.set_fact:
        node_plan: "{{ node_plan | default([]) + [normalized_row] }}"
      vars:
        normalized_row:
          node_name: "{{ item.node_name | default(item['Node Name'], true) | default('', true) | trim }}"
          aggregate_name: "{{ item.aggregate_name | default(item['Aggregate Name'], true) | default('', true) | trim }}"
      loop: "{{ node_rows }}"
      loop_control:
        label: "{{ item.node_name | default(item['Node Name'], true) | default('unnamed row', true) }}"

    - name: Build the aggregate list from the node rows
      ansible.builtin.set_fact:
        total_aggr_list: "{{ total_aggr_list | default([]) + [item.aggregate_name] }}"
      loop: "{{ node_plan | default([]) }}"
      when: item.aggregate_name | length > 0
      loop_control:
        label: "{{ item.aggregate_name }}"

    - name: Validate the aggregate list
      ansible.builtin.assert:
        that:
          - total_aggr_list | default([]) | length > 0
          - total_aggr_list | default([]) | unique | list | length == total_aggr_list | default([]) | length
        fail_msg: >-
          SVM creation needs at least one aggregate name from the node
          configuration rows, and those names must be unique. Requested names:
          {{ total_aggr_list | default([]) | join(', ') }}.

    - name: Validate the SVM name
      ansible.builtin.assert:
        that:
          - svm_name_normalized is match('^[A-Za-z_][A-Za-z0-9_.-]{0,40}$')
        fail_msg: >-
          SVM name must start with a letter or underscore, contain only
          letters, numbers, underscores, hyphens, and periods, and be at most
          41 characters.

    - name: Validate the IPspace name
      ansible.builtin.assert:
        that:
          - ipspace_name_normalized | length > 0
          - ipspace_name_normalized is match('^[A-Za-z_][A-Za-z0-9_.-]{0,63}$')
          - ipspace_name_normalized | lower not in ['default', 'cluster']
        fail_msg: >-
          SVM creation uses the IPspace name from Network Configuration. Enter
          a name that starts with a letter or underscore. Default and Cluster
          already exist and cannot be used here.

    - name: Validate that at least one protocol is selected
      ansible.builtin.assert:
        that:
          - protocol_list | length > 0
        fail_msg: Select nfs, iscsi, or both.

    - name: Validate each selected protocol
      ansible.builtin.assert:
        that:
          - item in ['nfs', 'iscsi']
        fail_msg: >-
          {{ item }} is not a supported protocol. Select nfs, iscsi, or both.
      loop: "{{ protocol_list }}"
      loop_control:
        label: "{{ item }}"

    - name: Show the aggregate list for the SVM
      ansible.builtin.debug:
        msg: >-
          {{ total_aggr_list | length }} aggregate(s) will be assigned to
          {{ svm_name_normalized }} in IPspace {{ ipspace_name_normalized }}
          with protocols {{ protocol_list | join(', ') }}:
          {{ total_aggr_list | join(', ') }}.

    - name: Create the SVM with the selected protocols
      netapp.ontap.na_ontap_svm:
        state: present
        name: "{{ svm_name_normalized }}"
        ipspace: "{{ ipspace_name_normalized }}"
        allowed_protocols: "{{ protocol_list }}"
        aggr_list: "{{ total_aggr_list }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always

    # ONTAP accepts this when a named protocol is already absent. nfs and iscsi stay.
    - name: Remove protocols that were not selected
      netapp.ontap.na_ontap_rest_cli:
        command: vserver/remove-protocols
        verb: PATCH
        params:
          vserver: "{{ svm_name_normalized }}"
        body:
          protocols:
            - fcp
            - cifs
            - ndmp
            - nvme
            - s3
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false

    - name: Enable NFS on the SVM
      netapp.ontap.na_ontap_nfs:
        state: present
        vserver: "{{ svm_name_normalized }}"
        service_state: started
        nfsv3: enabled
        nfsv41: enabled
        udp: disabled
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: "'nfs' in protocol_list"

    - name: Get the SVM root volume
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - storage/volumes
        parameters:
          name: "*root"
          svm.name: "{{ svm_name_normalized }}"
        fields:
          - name
          - aggregates
          - is_svm_root
      register: root_volume_info
      no_log: true

    - name: Select the SVM root volume
      ansible.builtin.set_fact:
        chosen_root_records: "{{ flagged_root_records if flagged_root_records | length > 0 else named_root_records }}"
      vars:
        volume_records: >-
          {{
            (root_volume_info.ontap_info.storage_volumes | default({})).records
            | default([])
          }}
        flagged_root_records: >-
          {{
            volume_records
            | selectattr('is_svm_root', 'defined')
            | selectattr('is_svm_root')
            | list
          }}
        named_root_records: >-
          {{
            volume_records
            | selectattr('name', 'equalto', svm_name_normalized ~ '_root')
            | list
          }}

    - name: Validate that the SVM root volume was found
      ansible.builtin.assert:
        that:
          - chosen_root_records | length > 0
        fail_msg: >-
          Expected the SVM root volume on {{ svm_name_normalized }}.

    - name: Record the SVM root volume and its aggregate
      ansible.builtin.set_fact:
        root_volume_name: "{{ chosen_root_records[0].name }}"
        root_aggregate_name: "{{ ((chosen_root_records[0].aggregates | default([])) | first | default({})).name | default('') }}"

    - name: Validate the SVM root volume aggregate
      ansible.builtin.assert:
        that:
          - root_volume_name | default('') | length > 0
          - root_aggregate_name | default('') | length > 0
        fail_msg: >-
          SVM root volume {{ root_volume_name | default('') }} did not report
          an aggregate.

    - name: Get the node that hosts the SVM root volume
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - storage/aggregates
        parameters:
          name: "{{ root_aggregate_name }}"
        fields:
          - name
          - node
      register: root_aggregate_info
      no_log: true

    - name: Validate the aggregate query for the SVM root volume
      ansible.builtin.assert:
        that:
          - (root_aggregate_info.ontap_info.storage_aggregates | default({})).records | default([]) | length > 0
        fail_msg: >-
          Aggregate {{ root_aggregate_name }} was not found, so the node that
          hosts the SVM root volume could not be read.

    - name: Record the SVM root volume node
      ansible.builtin.set_fact:
        root_node_name: "{{ root_aggregate_info.ontap_info.storage_aggregates.records[0].node.name | default('') }}"

    - name: Validate the SVM root volume node
      ansible.builtin.assert:
        that:
          - root_node_name | default('') | length > 0
        fail_msg: >-
          Aggregate {{ root_aggregate_name }} did not report the node that
          hosts the SVM root volume.

    - name: Validate that each node appears once
      ansible.builtin.assert:
        that:
          - aggregate_rows | map(attribute='node_name') | unique | list | length == aggregate_rows | length
        fail_msg: >-
          Each node name can appear only once. Requested names:
          {{ aggregate_rows | map(attribute='node_name') | join(', ') }}.
      vars:
        aggregate_rows: "{{ node_plan | default([]) | selectattr('aggregate_name') | list }}"
      when: node_plan | default([]) | selectattr('aggregate_name') | list | length > 0

    - name: Validate node names on rows that name an aggregate
      ansible.builtin.assert:
        that:
          - item.node_name | length > 0
        fail_msg: >-
          Row {{ ansible_loop.index }} names aggregate {{ item.aggregate_name }}
          and needs a node name.
      loop: "{{ node_plan | default([]) }}"
      when: item.aggregate_name | length > 0
      loop_control:
        extended: true
        label: "{{ item.aggregate_name | default('row ' ~ ansible_loop.index) }}"

    - name: Build the aggregate list for the SVM root volume node
      ansible.builtin.set_fact:
        aggr_list: "{{ aggr_list | default([]) + [item.aggregate_name] }}"
      loop: "{{ node_plan | default([]) }}"
      when:
        - item.node_name == root_node_name
        - item.aggregate_name | length > 0
      loop_control:
        label: "{{ item.node_name }}"

    - name: Validate that the root volume node is one of the node rows
      ansible.builtin.assert:
        that:
          - aggr_list | default([]) | length > 0
        fail_msg: >-
          The SVM root volume is on node {{ root_node_name }}, and none of the
          node configuration rows name that node. Aggregate names on the rows:
          {{ total_aggr_list | join(', ') }}.

    - name: Build the load-sharing mirror aggregate list
      ansible.builtin.set_fact:
        lsm_aggr_list: "{{ lsm_aggr_list | default([]) + [item] }}"
      loop: "{{ total_aggr_list }}"
      when: item not in (aggr_list | default([]))
      loop_control:
        label: "{{ item }}"

    - name: Show the load-sharing mirror plan
      ansible.builtin.debug:
        msg: >-
          Root volume {{ root_volume_name }} is on aggregate
          {{ root_aggregate_name }} on node {{ root_node_name }}.
          Aggregates on that node: {{ aggr_list | join(', ') }}.
          Mirror aggregates: {{ lsm_aggr_list | default([]) | join(', ') }}.

    - name: Note that every aggregate is on the SVM root volume node
      ansible.builtin.debug:
        msg: >-
          Every aggregate from the node rows is on {{ root_node_name }}, which
          hosts the SVM root volume. No load-sharing mirror was created.
      when: lsm_aggr_list | default([]) | length == 0

    - name: Validate that the job name and minutes are both set or both blank
      ansible.builtin.assert:
        that:
          - (job_name_normalized | length > 0) == (job_minutes_normalized | length > 0)
        fail_msg: >-
          Enter both a job name and job minutes, or clear both to skip the
          schedule and the load-sharing SnapMirror.

    - name: Validate the job name
      ansible.builtin.assert:
        that:
          - job_name_normalized is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$')
        fail_msg: >-
          Job name must start with a letter, number, or underscore and contain
          only letters, numbers, underscores, hyphens, and periods.
      when: job_name_normalized | length > 0

    - name: Validate the job minutes
      ansible.builtin.assert:
        that:
          - job_minute_tokens | length > 0
          - item is match('^[0-5]?[0-9]$')
        fail_msg: >-
          Job minutes must be whole numbers from 0 to 59, separated by commas.
          Example: 0,15,30,45.
      loop: "{{ job_minute_tokens if job_minute_tokens | length > 0 else ['missing'] }}"
      when: job_name_normalized | length > 0
      loop_control:
        label: "{{ item }}"

    - name: Read the job minutes
      ansible.builtin.set_fact:
        job_minute_list: "{{ job_minute_tokens | map('int') | list }}"
      when: job_name_normalized | length > 0

    - name: Validate that each job minute is unique
      ansible.builtin.assert:
        that:
          - job_minute_list | unique | list | length == job_minute_list | length
        fail_msg: >-
          Job minutes must be unique. Requested minutes:
          {{ job_minute_list | join(', ') }}.
      when: job_name_normalized | length > 0

    - name: Note that the job schedule was left blank
      ansible.builtin.debug:
        msg: >-
          Job name and job minutes are blank, so the job schedule, the
          load-sharing mirror volumes, and the SnapMirror relationship were
          skipped. Aggregates that would have received a mirror:
          {{ lsm_aggr_list | join(', ') }}.
      when:
        - lsm_aggr_list | default([]) | length > 0
        - job_name_normalized | length == 0

    - name: Build the load-sharing mirror volume names
      ansible.builtin.set_fact:
        lsm_vol_list: "{{ lsm_vol_list | default([]) + [root_volume_name ~ '_lsm0' ~ ('%x' | format(item))] }}"
      loop: "{{ range(1, (lsm_aggr_list | default([]) | length) + 1) | list }}"
      when:
        - lsm_aggr_list | default([]) | length > 0
        - job_name_normalized | length > 0
      loop_control:
        label: "{{ root_volume_name }}_lsm0{{ '%x' | format(item) }}"

    - name: Create the job schedule for the SVM root volume SnapMirror
      netapp.ontap.na_ontap_job_schedule:
        state: present
        name: "{{ job_name_normalized }}"
        job_minutes: "{{ job_minute_list }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: job_name_normalized | length > 0

    # An LS destination is created as type dp. The SnapMirror relationship then
    # changes it to type ls, and ONTAP rejects changing that type again. Create
    # a volume only when that name is not already present.
    - name: Read existing load-sharing mirror volumes
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - storage/volumes
        parameters:
          name: "{{ root_volume_name }}_lsm0*"
          svm.name: "{{ svm_name_normalized }}"
        fields:
          - name
          - type
          - aggregates
      register: lsm_volume_info
      when: lsm_vol_list | default([]) | length > 0
      no_log: true

    - name: Record existing load-sharing mirror volumes
      ansible.builtin.set_fact:
        lsm_existing_volumes: "{{ lsm_existing_volumes | default([]) + [row] }}"
      vars:
        row:
          name: "{{ item.name | default('') }}"
          volume_type: "{{ item.type | default('') | lower }}"
          aggregate_name: "{{ ((item.aggregates | default([])) | first | default({})).name | default('') }}"
      loop: "{{ (lsm_volume_info.ontap_info.storage_volumes | default({})).records | default([]) }}"
      when:
        - lsm_vol_list | default([]) | length > 0
        - item.name | default('') in lsm_vol_list
      loop_control:
        label: "{{ item.name | default('unnamed volume') }}"

    - name: Validate existing load-sharing mirror volumes
      ansible.builtin.assert:
        that:
          - matched | length == 1
          - matched[0].volume_type in ['dp', 'ls']
          - matched[0].aggregate_name == item.0
        fail_msg: >-
          Load-sharing mirror volume {{ item.1 }} already exists as type
          {{ matched[0].volume_type | default('unknown') }} on aggregate
          {{ matched[0].aggregate_name | default('unknown') }}. Expected type
          dp or ls on {{ item.0 }}.
      vars:
        matched: "{{ lsm_existing_volumes | default([]) | selectattr('name', 'equalto', item.1) | list }}"
      loop: "{{ lsm_aggr_list | default([]) | zip(lsm_vol_list | default([])) | list }}"
      when:
        - lsm_vol_list | default([]) | length > 0
        - item.1 in (lsm_existing_volumes | default([]) | map(attribute='name') | list)
      loop_control:
        label: "{{ item.1 }} on {{ item.0 }}"

    - name: Choose load-sharing mirror volumes that do not exist yet
      ansible.builtin.set_fact:
        lsm_volumes_to_create: "{{ lsm_volumes_to_create | default([]) + [[item.0, item.1]] }}"
      vars:
        existing_names: "{{ lsm_existing_volumes | default([]) | map(attribute='name') | list }}"
      loop: "{{ lsm_aggr_list | default([]) | zip(lsm_vol_list | default([])) | list }}"
      when:
        - lsm_vol_list | default([]) | length > 0
        - item.1 not in existing_names
      loop_control:
        label: "{{ item.1 }} on {{ item.0 }}"

    - name: Show the load-sharing mirror volume plan
      ansible.builtin.debug:
        msg: >-
          Volumes to create:
          {{ lsm_volumes_to_create | default([]) | map('last') | join(', ') if (lsm_volumes_to_create | default([]) | length > 0) else 'none' }}.
          Volumes already present:
          {{ lsm_existing_volumes | default([]) | map(attribute='name') | join(', ') if (lsm_existing_volumes | default([]) | length > 0) else 'none' }}.
      when: lsm_vol_list | default([]) | length > 0

    - name: Create the load-sharing mirror volumes of the SVM root volume
      netapp.ontap.na_ontap_volume:
        state: present
        vserver: "{{ svm_name_normalized }}"
        name: "{{ item.1 }}"
        aggregate_name: "{{ item.0 }}"
        size: 1
        size_unit: gb
        type: DP
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      loop: "{{ lsm_volumes_to_create | default([]) }}"
      when: lsm_volumes_to_create | default([]) | length > 0
      loop_control:
        label: "{{ item.1 }} on {{ item.0 }}"

    # The public SnapMirror REST API rejects a load-sharing relationship, and the
    # ZAPI module needs the netapp-lib package. The private CLI path does neither.
    - name: Read load-sharing SnapMirror relationships for the SVM root volume
      netapp.ontap.na_ontap_rest_cli:
        command: snapmirror
        verb: GET
        params:
          source-path: "{{ svm_name_normalized }}:{{ root_volume_name }}"
          fields: destination-path,state
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      register: lsm_snapmirror_info
      when: lsm_vol_list | default([]) | length > 0

    - name: Record existing load-sharing destinations
      ansible.builtin.set_fact:
        lsm_relationship_rows: "{{ lsm_relationship_rows | default([]) + [row] }}"
      vars:
        destination_path: "{{ item['destination-path'] | default(item['destination_path'] | default('')) }}"
        row:
          # CLI returns cluster://svm/volume. svm:volume is the other form.
          # The volume name is the last segment of either path.
          volume: "{{ destination_path | regex_replace('^.*[:/]', '') }}"
          mirror_state: "{{ (item['state'] | default(item['mirror-state'] | default(item['mirror_state'] | default('')))) | lower }}"
      loop: "{{ (lsm_snapmirror_info.msg | default({})).records | default([]) }}"
      when: lsm_vol_list | default([]) | length > 0
      loop_control:
        label: "{{ item['destination-path'] | default(item['destination_path'] | default('unknown destination')) }}"

    - name: Choose load-sharing mirrors that do not have a relationship yet
      ansible.builtin.set_fact:
        lsm_missing_volumes: "{{ lsm_vol_list | difference(existing_volumes) }}"
      vars:
        existing_volumes: "{{ lsm_relationship_rows | default([]) | map(attribute='volume') | list }}"
      when: lsm_vol_list | default([]) | length > 0

    - name: Decide whether the load-sharing mirrors need to be initialized
      ansible.builtin.set_fact:
        lsm_needs_initialize: "{{ pending_volumes | length > 0 }}"
      vars:
        initialized_volumes: >-
          {{
            lsm_relationship_rows | default([])
            | selectattr('mirror_state', 'equalto', 'snapmirrored')
            | map(attribute='volume')
            | list
          }}
        pending_volumes: "{{ lsm_vol_list | difference(initialized_volumes) }}"
      when: lsm_vol_list | default([]) | length > 0

    - name: Show the load-sharing SnapMirror plan
      ansible.builtin.debug:
        msg: >-
          Source {{ svm_name_normalized }}:{{ root_volume_name }}.
          Relationships to create:
          {{ lsm_missing_volumes | default([]) | join(', ') if (lsm_missing_volumes | default([]) | length > 0) else 'none' }}.
          Initialize the load-sharing set:
          {{ 'yes' if (lsm_needs_initialize | default(false) | bool) else 'no' }}.
      when: lsm_vol_list | default([]) | length > 0

    - name: Create the load-sharing SnapMirror relationship
      netapp.ontap.na_ontap_rest_cli:
        command: snapmirror
        verb: POST
        body:
          source-path: "{{ svm_name_normalized }}:{{ root_volume_name }}"
          destination-path: "{{ svm_name_normalized }}:{{ item }}"
          type: LS
          schedule: "{{ job_name_normalized }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: "{{ lsm_missing_volumes | default([]) }}"
      when: lsm_missing_volumes | default([]) | length > 0
      loop_control:
        label: "{{ svm_name_normalized }}:{{ item }}"

    - name: Initialize the load-sharing SnapMirror set
      netapp.ontap.na_ontap_rest_cli:
        command: snapmirror/initialize-ls-set
        verb: POST
        body:
          source-path: "{{ svm_name_normalized }}:{{ root_volume_name }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      when:
        - lsm_vol_list | default([]) | length > 0
        - lsm_needs_initialize | default(false) | bool

    - name: Create and enable the iSCSI service
      netapp.ontap.na_ontap_iscsi:
        state: present
        vserver: "{{ svm_name_normalized }}"
        service_state: started
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: "'iscsi' in protocol_list"

    - name: Note that the vsadmin password was left blank
      ansible.builtin.debug:
        msg: The vsadmin password is blank, so vsadmin was left unchanged.
      when: vsadmin_password_normalized | length == 0

    - name: Set the vsadmin password
      netapp.ontap.na_ontap_user:
        state: present
        vserver: "{{ svm_name_normalized }}"
        name: vsadmin
        applications: http,ontapi,ssh
        authentication_method: password
        role_name: vsadmin
        lock_user: true
        set_password: "{{ vsadmin_password_normalized }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: vsadmin_password_normalized | length > 0
      no_log: true

    - name: Unlock the vsadmin user
      netapp.ontap.na_ontap_user:
        state: present
        vserver: "{{ svm_name_normalized }}"
        name: vsadmin
        applications: http,ontapi,ssh
        authentication_method: password
        role_name: vsadmin
        lock_user: false
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: vsadmin_password_normalized | length > 0

    - name: Note that the SVM login banner was left blank
      ansible.builtin.debug:
        msg: The SVM login banner is blank, so the banner was left unchanged.
      when: svm_login_banner_normalized | length == 0

    - name: Create the SVM login banner
      netapp.ontap.na_ontap_login_messages:
        vserver: "{{ svm_name_normalized }}"
        banner: "{{ svm_login_banner_normalized }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: svm_login_banner_normalized | length > 0

    - name: Note that the SVM management LIF was skipped
      ansible.builtin.debug:
        msg: >-
          svm_mgmt_lif_name, svm_mgmt_lif_address, or svm_mgmt_lif_netmask is
          blank, so SVM management LIF creation was skipped.
      when:
        - svm_mgmt_lif_plan.lif_name | length == 0
          or svm_mgmt_lif_plan.address | length == 0
          or svm_mgmt_lif_plan.netmask | length == 0

    - name: Note that the SVM management LIF home port was left blank
      ansible.builtin.debug:
        msg: >-
          The interface group name or the in-band management VLAN name or
          VLAN ID is blank, so SVM management LIF creation was skipped.
      when:
        - svm_mgmt_lif_plan.lif_name | length > 0
        - svm_mgmt_lif_plan.address | length > 0
        - svm_mgmt_lif_plan.netmask | length > 0
        - not (svm_mgmt_lif_requested | bool)

    - name: Validate svm_mgmt_lif_name
      ansible.builtin.assert:
        that:
          - svm_mgmt_lif_plan.lif_name is match('^[A-Za-z_][A-Za-z0-9_.-]{0,254}$')
        fail_msg: >-
          svm_mgmt_lif_name must start with a letter or underscore and contain
          only letters, numbers, underscores, hyphens, and periods.
      when: svm_mgmt_lif_requested | bool

    - name: Validate svm_mgmt_lif_address
      ansible.builtin.assert:
        that:
          - svm_mgmt_lif_plan.address is match(ipv4_pattern)
        fail_msg: svm_mgmt_lif_address must be an IPv4 address.
      when: svm_mgmt_lif_requested | bool

    - name: Validate svm_mgmt_lif_netmask
      ansible.builtin.assert:
        that:
          - svm_mgmt_lif_plan.netmask in ipv4_netmasks
        fail_msg: >-
          svm_mgmt_lif_netmask must be a dotted IPv4 netmask, for example
          255.255.255.0.
      when: svm_mgmt_lif_requested | bool

    - name: Validate the interface group used by the SVM management LIF
      ansible.builtin.assert:
        that:
          - ifgrp_name_normalized is match('^a(0|[1-9][0-9]{0,2})[a-z]$')
        fail_msg: >-
          The SVM management LIF home port uses the interface group name.
          Example: a0a.
      when: svm_mgmt_lif_requested | bool

    - name: Validate the in-band management VLAN name used by the SVM management LIF
      ansible.builtin.assert:
        that:
          - ib_mgmt_vlan_name_normalized is match('^[A-Za-z_][A-Za-z0-9_.-]{0,63}$')
          - ib_mgmt_vlan_name_normalized | lower not in ['default', 'cluster']
        fail_msg: >-
          The SVM management LIF home port uses the in-band management VLAN.
          Enter a VLAN name that starts with a letter or underscore. Default
          and Cluster already exist and cannot be used here.
      when: svm_mgmt_lif_requested | bool

    - name: Validate the in-band management VLAN ID used by the SVM management LIF
      ansible.builtin.assert:
        that:
          - ib_mgmt_vlan_id_normalized is match('^[1-9][0-9]{0,3}$')
          - ib_mgmt_vlan_id_normalized | int <= 4094
        fail_msg: >-
          The SVM management LIF home port uses the in-band management VLAN ID.
          Enter a VLAN ID from 1 to 4094. The home port is
          <interface group>-<VLAN ID>, for example a0a-2235.
      when: svm_mgmt_lif_requested | bool

    - name: Show the SVM management LIF plan
      ansible.builtin.debug:
        msg: >-
          SVM management LIF {{ svm_mgmt_lif_plan.lif_name }} at
          {{ svm_mgmt_lif_plan.address }} netmask
          {{ svm_mgmt_lif_plan.netmask }} will be created on node
          {{ root_node_name }}, home port
          {{ ifgrp_name_normalized }}-{{ ib_mgmt_vlan_id_normalized }}.
      when: svm_mgmt_lif_requested | bool

    # Home node is the node that hosts the SVM root volume, recorded above.
    # Home port is the in-band management VLAN interface, for example a0a-2235.
    - name: Create the SVM management LIF
      netapp.ontap.na_ontap_interface:
        state: present
        vserver: "{{ svm_name_normalized }}"
        interface_name: "{{ svm_mgmt_lif_plan.lif_name }}"
        service_policy: default-management
        home_node: "{{ root_node_name }}"
        home_port: "{{ ifgrp_name_normalized }}-{{ ib_mgmt_vlan_id_normalized }}"
        address: "{{ svm_mgmt_lif_plan.address }}"
        netmask: "{{ svm_mgmt_lif_plan.netmask }}"
        admin_status: up
        failover_policy: broadcast-domain-wide
        is_auto_revert: true
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: svm_mgmt_lif_requested | bool

    - name: Note that the SVM default route was skipped
      ansible.builtin.debug:
        msg: >-
          svm_mgmt_lif_gateway is blank, so the SVM default route was skipped.
      when: svm_mgmt_lif_plan.gateway | length == 0

    - name: Note that the SVM default route was skipped because the LIF was skipped
      ansible.builtin.debug:
        msg: >-
          The SVM management LIF was skipped, so the SVM default route was
          skipped.
      when:
        - svm_mgmt_lif_plan.gateway | length > 0
        - not (svm_mgmt_lif_requested | bool)

    - name: Validate svm_mgmt_lif_gateway
      ansible.builtin.assert:
        that:
          - svm_mgmt_lif_plan.gateway is match(ipv4_pattern)
        fail_msg: svm_mgmt_lif_gateway must be an IPv4 address.
      when: svm_mgmt_route_requested | bool

    - name: Validate that svm_mgmt_lif_address and svm_mgmt_lif_gateway differ
      ansible.builtin.assert:
        that:
          - svm_mgmt_lif_plan.address != svm_mgmt_lif_plan.gateway
        fail_msg: svm_mgmt_lif_address and svm_mgmt_lif_gateway must be different.
      when: svm_mgmt_route_requested | bool

    - name: Show the SVM default route plan
      ansible.builtin.debug:
        msg: >-
          The SVM default route to 0.0.0.0/0 will use gateway
          {{ svm_mgmt_lif_plan.gateway }}.
      when: svm_mgmt_route_requested | bool

    - name: Create the default route on the SVM
      netapp.ontap.na_ontap_net_routes:
        state: present
        vserver: "{{ svm_name_normalized }}"
        destination: 0.0.0.0/0
        gateway: "{{ svm_mgmt_lif_plan.gateway }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: svm_mgmt_route_requested | bool

    - name: Note that SVM DNS was left blank
      ansible.builtin.debug:
        msg: DNS domain and DNS servers are blank, so SVM DNS was skipped.
      when: not (svm_dns_requested | bool)

    - name: Validate that the SVM DNS domain and servers are both set or both blank
      ansible.builtin.assert:
        that:
          - svm_dns_ready | bool
        fail_msg: >-
          Enter both a DNS domain and DNS servers, or clear both to skip SVM DNS.
      when: svm_dns_requested | bool

    - name: Validate the SVM DNS domain
      ansible.builtin.assert:
        that:
          - svm_dns_domain_normalized is match('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$')
        fail_msg: >-
          DNS domain must be a domain name, for example example.com.
      when: svm_dns_ready | bool

    - name: Validate the SVM DNS servers
      ansible.builtin.assert:
        that:
          - item is match(ipv4_pattern)
        fail_msg: >-
          DNS servers must be comma-separated IPv4 addresses. Example:
          10.1.1.10,10.1.1.11.
      loop: "{{ svm_dns_server_list }}"
      when: svm_dns_ready | bool
      loop_control:
        label: "{{ item }}"

    - name: Validate that each SVM DNS server is unique
      ansible.builtin.assert:
        that:
          - svm_dns_server_list | unique | list | length == svm_dns_server_list | length
        fail_msg: >-
          DNS server addresses must be unique. Requested servers:
          {{ svm_dns_server_list | join(', ') }}.
      when: svm_dns_ready | bool

    - name: Show the SVM DNS plan
      ansible.builtin.debug:
        msg: >-
          SVM {{ svm_name_normalized }} DNS domain is {{ svm_dns_domain_normalized }}.
          Name servers: {{ svm_dns_server_list | join(', ') }}.
      when: svm_dns_ready | bool

    - name: Configure DNS for the SVM
      netapp.ontap.na_ontap_dns:
        state: present
        vserver: "{{ svm_name_normalized }}"
        nameservers: "{{ svm_dns_server_list }}"
        domains: "{{ svm_dns_domain_normalized }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      when: svm_dns_ready | bool
