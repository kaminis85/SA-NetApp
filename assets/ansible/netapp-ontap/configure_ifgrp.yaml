---
- name: Create ONTAP data interface groups
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ifgrp_name_normalized: "{{ ifgrp_name | default('') | trim | lower }}"
    ifgrp_mode_normalized: "{{ ifgrp_mode | default('multimode_lacp') | trim | lower }}"
    node_rows: >-
      {{
        (node_specs | from_json)
        if node_specs is string
        else node_specs
      }}

  tasks:

    - name: Note that no interface group name was provided
      ansible.builtin.debug:
        msg: No interface group name was provided, so this step made no change.
      when: ifgrp_name_normalized | length == 0

    - name: Stop when the interface group name is empty
      ansible.builtin.meta: end_play
      when: ifgrp_name_normalized | length == 0

    - name: Validate the interface group name
      ansible.builtin.assert:
        that:
          - ifgrp_name_normalized is match('^a(0|[1-9][0-9]{0,2})[a-z]$')
        fail_msg: >-
          Interface group name must look like a0a: the letter a, a number from
          0 to 999 with no leading zeros, and one lowercase letter.

    - name: Validate the interface group mode
      ansible.builtin.assert:
        that:
          - ifgrp_mode_normalized in ['multimode_lacp', 'multimode', 'singlemode']
        fail_msg: >-
          Interface group mode must be multimode_lacp, multimode, or singlemode.

    - name: Normalize node rows
      ansible.builtin.set_fact:
        node_plan: "{{ node_plan | default([]) + [normalized_row] }}"
      vars:
        ports_raw: "{{ item.ports | default(item['Data Ports'], true) | default('', true) }}"
        normalized_row:
          node_name: "{{ item.node_name | default(item['Node Name'], true) | default('', true) | trim }}"
          ports: >-
            {{
              (
                ports_raw
                if ports_raw is not string
                else ports_raw.split(',') | map('trim') | reject('equalto', '') | list
              ) | unique | list
            }}
      loop: "{{ node_rows }}"
      loop_control:
        label: "{{ item.node_name | default(item['Node Name'], true) | default('unnamed row', true) }}"

    - name: Validate node names
      ansible.builtin.assert:
        that:
          - node_plan | length > 0
          - item.node_name | length > 0
        fail_msg: >-
          Row {{ ansible_loop.index }} needs a node name.
      loop: "{{ node_plan }}"
      loop_control:
        extended: true
        label: "{{ item.node_name | default('row ' ~ ansible_loop.index) }}"

    - name: Validate that each node appears once
      ansible.builtin.assert:
        that:
          - node_plan | map(attribute='node_name') | unique | list | length == node_plan | length
        fail_msg: >-
          Each node name can appear only once. Requested names:
          {{ node_plan | map(attribute='node_name') | join(', ') }}.

    - name: Select nodes that list data ports
      ansible.builtin.set_fact:
        port_plan: "{{ port_plan | default([]) + [item] }}"
      loop: "{{ node_plan }}"
      when: item.ports | length > 0
      loop_control:
        label: "{{ item.node_name }}"

    - name: Note that no data ports were provided
      ansible.builtin.debug:
        msg: No data ports were provided, so this step made no change.
      when: port_plan | default([]) | length == 0

    - name: Stop when no interface group is needed
      ansible.builtin.meta: end_play
      when: port_plan | default([]) | length == 0

    # na_ontap_net_ifgrp does not accept a name when it uses REST, and ONTAP
    # then chooses the interface group name. The CLI creates the requested name.
    - name: Get Ethernet ports
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - network/ethernet/ports
        fields:
          - name
          - node
          - type
          - lag.member_ports
      register: port_info
      no_log: true

    - name: Record interface groups that already use this name
      ansible.builtin.set_fact:
        existing_ifgrps: "{{ existing_ifgrps | default({}) | combine({node_name: member_names}) }}"
      vars:
        node_name: "{{ (item.node | default({})).name | default('') }}"
        member_names: >-
          {{
            (item.lag | default({})).member_ports
            | default([])
            | map(attribute='name')
            | list
          }}
      when:
        - item.type | default('') == 'lag'
        - item.name == ifgrp_name_normalized
        - node_name | length > 0
      loop: "{{ port_info.ontap_info.network_ethernet_ports.records | default([]) }}"
      loop_control:
        label: "{{ (item.node | default({})).name | default('unknown node') }}/{{ item.name | default('unnamed port') }}"

    - name: Create the interface group on each node
      netapp.ontap.na_ontap_rest_cli:
        command: network/port/ifgrp
        verb: POST
        body:
          node: "{{ item.node_name }}"
          ifgrp: "{{ ifgrp_name_normalized }}"
          distr-func: port
          mode: "{{ ifgrp_mode_normalized }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: "{{ port_plan }}"
      when: item.node_name not in (existing_ifgrps | default({}))
      loop_control:
        label: "{{ item.node_name }}/{{ ifgrp_name_normalized }}"

    - name: Add data ports to the interface group
      netapp.ontap.na_ontap_rest_cli:
        command: network/port/ifgrp/add-port
        verb: POST
        body:
          node: "{{ item.0.node_name }}"
          ifgrp: "{{ ifgrp_name_normalized }}"
          port: "{{ item.1 }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: "{{ port_plan | subelements('ports') }}"
      when: item.1 not in ((existing_ifgrps | default({})).get(item.0.node_name, []))
      loop_control:
        label: "{{ item.0.node_name }}/{{ ifgrp_name_normalized }}/{{ item.1 }}"

    - name: Set the interface group MTU to 9000
      netapp.ontap.na_ontap_rest_cli:
        command: "network/port/objects/{{ item.node_name }}/{{ ifgrp_name_normalized }}"
        verb: PATCH
        body:
          mtu: "9000"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: "{{ port_plan }}"
      loop_control:
        label: "{{ item.node_name }}/{{ ifgrp_name_normalized }}"
