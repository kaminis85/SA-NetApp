---
# Undo of configure_snmp.yaml.
# Restores contact, location, and the enabled flag only when they still match
# this deployment. Deletes only the users and traphosts this deployment added.
# Safe to run twice.
- name: Restore ONTAP SNMP
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_snmp:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
    netapp.ontap.na_ontap_snmp_traphosts:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
    netapp.ontap.na_ontap_snmp_config:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
    netapp.ontap.na_ontap_rest_cli:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
    netapp.ontap.na_ontap_rest_info:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
      use_python_keys: true
  vars:
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (
            prior_config | string | trim
            | replace('&quot;', '"')
            | replace('&#34;', '"')
            | replace('&amp;', '&')
            | replace('&#39;', "'")
            | replace('&apos;', "'")
            | replace('&lt;', '<')
            | replace('&gt;', '>')
          )
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Note that this deployment did not change SNMP
      ansible.builtin.debug:
        msg: This deployment did not change SNMP, so End leaves it unchanged.
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Stop when SNMP was not changed
      when: not (incoming_prior.changed | default(false) | bool)
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Read SNMP
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - support/snmp
        fields:
          - enabled
          - contact
          - location
      register: snmp_info

    - name: Read SNMP users
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - support/snmp/users
        fields:
          - name
      register: snmp_users

    - name: Read SNMP traphosts
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - support/snmp/traphosts
        fields:
          - host
      register: snmp_traphosts

    - name: Read the SNMP contact
      netapp.ontap.na_ontap_rest_cli:
        command: system/snmp/contact
        verb: GET
      register: snmp_contact_show

    - name: Read the SNMP location
      netapp.ontap.na_ontap_rest_cli:
        command: system/snmp/location
        verb: GET
      register: snmp_location_show

    - name: Record the current SNMP configuration
      ansible.builtin.set_fact:
        live_snmp:
          enabled: "{{ 'true' if (snmp_record.enabled | default(false) | bool) else 'false' }}"
          contact: "{{ snmp_contact_live }}"
          location: "{{ snmp_location_live }}"
        existing_users: >-
          {{
            (snmp_users.ontap_info.support_snmp_users | default({})).records
            | default([])
            | map(attribute='name')
            | map('string')
            | map('trim')
            | list
          }}
        existing_traphosts: >-
          {{
            (snmp_traphosts.ontap_info.support_snmp_traphosts | default({})).records
            | default([])
            | map(attribute='host')
            | map('string')
            | map('trim')
            | list
          }}
        users_to_delete: >-
          {{
            incoming_prior.added_users | default([])
            | intersect(
                (snmp_users.ontap_info.support_snmp_users | default({})).records
                | default([])
                | map(attribute='name')
                | map('string')
                | map('trim')
                | list
              )
          }}
        traphosts_to_delete: >-
          {{
            incoming_prior.added_traphosts | default([])
            | intersect(
                (snmp_traphosts.ontap_info.support_snmp_traphosts | default({})).records
                | default([])
                | map(attribute='host')
                | map('string')
                | map('trim')
                | list
              )
          }}
      vars:
        snmp_record: >-
          {{
            (snmp_info.ontap_info.support_snmp | default({})).records
            | default([snmp_info.ontap_info.support_snmp | default({})])
            | first
            | default({})
          }}
        contact_record: >-
          {{
            (snmp_contact_show.msg.records | default([snmp_contact_show.msg | default({})]))
            | first
            | default({})
          }}
        location_record: >-
          {{
            (snmp_location_show.msg.records | default([snmp_location_show.msg | default({})]))
            | first
            | default({})
          }}
        snmp_contact_live: "{{ contact_record.contact | default('') | string }}"
        snmp_location_live: "{{ location_record.location | default('') | string }}"

    - name: Delete SNMP users added by this deployment
      netapp.ontap.na_ontap_snmp:
        state: absent
        snmp_username: "{{ item }}"
      loop: "{{ users_to_delete }}"
      loop_control:
        label: "{{ item }}"

    - name: Delete SNMP traphosts added by this deployment
      netapp.ontap.na_ontap_snmp_traphosts:
        state: absent
        host: "{{ item }}"
      loop: "{{ traphosts_to_delete }}"
      loop_control:
        label: "{{ item }}"

    - name: Restore the SNMP contact
      netapp.ontap.na_ontap_rest_cli:
        command: system/snmp/contact
        verb: PATCH
        body:
          contact: "{{ incoming_prior.previous.contact | default('') }}"
      when:
        - live_snmp.contact == (incoming_prior.applied.contact | default('') | string)
        - (incoming_prior.previous.contact | default('') | string) != (incoming_prior.applied.contact | default('') | string)

    - name: Restore the SNMP location
      netapp.ontap.na_ontap_rest_cli:
        command: system/snmp/location
        verb: PATCH
        body:
          location: "{{ incoming_prior.previous.location | default('') }}"
      when:
        - live_snmp.location == (incoming_prior.applied.location | default('') | string)
        - (incoming_prior.previous.location | default('') | string) != (incoming_prior.applied.location | default('') | string)

    - name: Disable SNMP
      netapp.ontap.na_ontap_snmp_config:
        state: present
        enabled: false
      when:
        - (incoming_prior.previous.enabled | string) == 'false'
        - live_snmp.enabled == 'true'
        - (incoming_prior.applied.enabled | string) == 'true'

    - name: Report the restored SNMP configuration
      ansible.builtin.debug:
        msg: >-
          Restored SNMP. Deleted users {{ users_to_delete | join(', ') if users_to_delete | length > 0 else 'none' }}.
          Deleted traphosts {{ traphosts_to_delete | join(', ') if traphosts_to_delete | length > 0 else 'none' }}.
