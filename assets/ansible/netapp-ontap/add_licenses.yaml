---
- name: Add ONTAP licenses
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (
            prior_config | string | trim
            | replace('&quot;', '"')
            | replace('&#34;', '"')
            | replace('&amp;', '&')
            | replace('&#39;', "'")
            | replace('&apos;', "'")
            | replace('&lt;', '<')
            | replace('&gt;', '>')
          )
        )
      }}

  tasks:
    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Read installed licenses
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - cluster/licensing/licenses
        fields:
          - name
          - licenses.serial_number
      register: licenses_before
      no_log: true

    - name: Record the license packages before this launch
      ansible.builtin.set_fact:
        license_packages_before: >-
          {{
            (licenses_before.ontap_info.cluster_licensing_licenses | default({})).records
            | default([])
          }}

    - name: Collect license serials before this launch
      ansible.builtin.set_fact:
        licenses_before_list: "{{ licenses_before_list | default([]) + [license_id] }}"
      vars:
        license_id:
          name: "{{ item.0.name | default('') | string | trim }}"
          serial: "{{ item.1.serial_number | default('') | string | trim }}"
      loop: "{{ license_packages_before | subelements('licenses', skip_missing=True) }}"
      when: item.1.serial_number | default('') | string | trim | length > 0
      no_log: true

    - name: Choose the license format from the values that were entered
      ansible.builtin.set_fact:
        license_key_format: "{{ 'legacy' if (legacy_license_keys | default('') | length > 0) else 'NLF' }}"

    - name: Validate legacy license keys
      ansible.builtin.assert:
        that:
          - legacy_license_keys | default('') | length > 0
        fail_msg: Provide legacy_license_keys as a comma-separated list.
      when: license_key_format == 'legacy'

    - name: Add licenses using legacy keys
      netapp.ontap.na_ontap_license:
        state: present
        license_codes: "{{ legacy_license_keys.split(',') | map('trim') | reject('equalto', '') | list }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      when: license_key_format == 'legacy'
      no_log: true

    - name: Validate the NLF license contents
      ansible.builtin.assert:
        that:
          - nlf_license_content | default('') | length > 0
        fail_msg: Paste the NetApp license file contents into nlf_license_content.
      when: license_key_format == 'NLF'

    - name: Add licenses using a NetApp license file
      netapp.ontap.na_ontap_license:
        state: present
        license_codes:
          - "{{ nlf_license_content }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      when: license_key_format == 'NLF'
      no_log: true

    - name: Read installed licenses after this launch
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - cluster/licensing/licenses
        fields:
          - name
          - licenses.serial_number
      register: licenses_after
      no_log: true

    - name: Record the license packages after this launch
      ansible.builtin.set_fact:
        license_packages_after: >-
          {{
            (licenses_after.ontap_info.cluster_licensing_licenses | default({})).records
            | default([])
          }}

    - name: Collect license serials added by this launch
      ansible.builtin.set_fact:
        added_now: "{{ added_now | default([]) + [license_id] }}"
      vars:
        license_id:
          name: "{{ item.0.name | default('') | string | trim }}"
          serial: "{{ item.1.serial_number | default('') | string | trim }}"
      loop: "{{ license_packages_after | subelements('licenses', skip_missing=True) }}"
      when:
        - item.1.serial_number | default('') | string | trim | length > 0
        - license_id not in (licenses_before_list | default([]))
      no_log: true

    - name: Keep licenses this deployment already added
      ansible.builtin.set_fact:
        added_licenses: "{{ incoming_prior.added | default([]) }}"
      when: incoming_prior.changed | default(false) | bool

    - name: Start a new license list when this deployment has not added one
      ansible.builtin.set_fact:
        added_licenses: []
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Add license serials that were not already on the cluster
      ansible.builtin.set_fact:
        added_licenses: "{{ added_licenses + [item] }}"
      loop: "{{ added_now | default([]) }}"
      when: item not in added_licenses
      no_log: true

    - name: Export the licenses this deployment added
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ {'changed': (added_licenses | length > 0), 'added': added_licenses} | to_json }}"
      no_log: true
