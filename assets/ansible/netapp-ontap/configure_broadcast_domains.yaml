# Each network below is one entry from the FlexPod VLAN list:
#   in-band management has no storage protocol and no fabric, MTU 1500
#   NFS is storage protocol NFS and has no fabric, MTU 9000
#   iSCSI-A is storage protocol iSCSI, fabric A, MTU 9000
#   iSCSI-B is storage protocol iSCSI, fabric B, MTU 9000
# Fabric is not sent to ONTAP. It distinguishes the two iSCSI VLANs.
# A broadcast domain is created when its VLAN name is set. The VLAN ID is
# not used here. It is used later, when the VLAN interface is created.
# The VLAN name is also the broadcast domain name.
# This task runs after the IPspace. The VLAN name is checked just before
# the broadcast domain is created.
# End deletes a broadcast domain only when this deployment created it.
- name: Create ONTAP broadcast domains
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ipspace_name_normalized: "{{ ipspace_name | default('') | string | trim }}"
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (prior_config | string | trim)
        )
      }}
    network_inputs:
      - role: In-band management
        protocol: management
        fabric: ""
        name: "{{ ib_mgmt_vlan_name | default('') | string | trim }}"
        mtu: 1500
      - role: NFS
        protocol: NFS
        fabric: ""
        name: "{{ nfs_vlan_name | default('') | string | trim }}"
        mtu: 9000
      - role: iSCSI-A
        protocol: iSCSI
        fabric: A
        name: "{{ iscsi_a_vlan_name | default('') | string | trim }}"
        mtu: 9000
      - role: iSCSI-B
        protocol: iSCSI
        fabric: B
        name: "{{ iscsi_b_vlan_name | default('') | string | trim }}"
        mtu: 9000

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Skip a network when its VLAN name is blank
      ansible.builtin.debug:
        msg: >-
          {{ item.role }} is skipped because its VLAN name is blank.
      loop: "{{ network_inputs }}"
      when: item.name | length == 0
      loop_control:
        label: "{{ item.role }}"

    - name: Select networks that have a VLAN name
      ansible.builtin.set_fact:
        vlan_plan: "{{ network_inputs | selectattr('name') | list }}"

    - name: Note that no VLAN name was provided
      ansible.builtin.debug:
        msg: No VLAN name was provided, so no broadcast domain was created.
      when: vlan_plan | length == 0

    - name: Keep the earlier broadcast-domain record when none were requested
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ incoming_prior | to_json }}"
      when:
        - vlan_plan | length == 0
        - incoming_prior.changed | default(false) | bool

    - name: Record that no broadcast domain was changed
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ {'changed': false} | to_json }}"
      when:
        - vlan_plan | length == 0
        - not (incoming_prior.changed | default(false) | bool)

    - name: Stop when no VLAN was requested
      ansible.builtin.meta: end_play
      when: vlan_plan | length == 0

    - name: Validate the IPspace name
      ansible.builtin.assert:
        that:
          - ipspace_name_normalized | length > 0
          - ipspace_name_normalized is match('^[A-Za-z_][A-Za-z0-9_.-]{0,63}$')
          - ipspace_name_normalized | lower not in ['default', 'cluster']
        fail_msg: >-
          Broadcast domains are created in the IPspace. Enter a name that
          starts with a letter or underscore. Default and Cluster already
          exist and cannot be used here.

    - name: Validate VLAN names
      ansible.builtin.assert:
        that:
          - item.name is match('^[A-Za-z_][A-Za-z0-9_.-]{0,63}$')
          - item.name | lower not in ['default', 'cluster']
        fail_msg: >-
          {{ item.role }} VLAN name must start with a letter or underscore and
          contain only letters, numbers, underscores, hyphens, and periods.
          Default and Cluster are reserved.
      loop: "{{ vlan_plan }}"
      loop_control:
        label: "{{ item.role }}"

    - name: Validate that VLAN names are unique
      ansible.builtin.assert:
        that:
          - vlan_plan | map(attribute='name') | map('lower') | unique | list | length == vlan_plan | length
        fail_msg: >-
          VLAN names must be unique. Requested names:
          {{ vlan_plan | map(attribute='name') | join(', ') }}.

    - name: Read broadcast domains in this IPspace
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - network/ethernet/broadcast-domains
        parameters:
          ipspace.name: "{{ ipspace_name_normalized }}"
        fields:
          - name
          - ipspace
      register: domain_info

    - name: Record broadcast domains that are not already present
      ansible.builtin.set_fact:
        added_now: "{{ added_now | default([]) + [row] }}"
      vars:
        row:
          id: "{{ ipspace_name_normalized }}/{{ item.name }}"
          name: "{{ item.name }}"
          ipspace: "{{ ipspace_name_normalized }}"
          role: "{{ item.role }}"
        existing_names: >-
          {{
            ((domain_info.ontap_info | default({})).network_ethernet_broadcast_domains | default({})).records
            | default([])
            | map(attribute='name')
            | map('string')
            | list
          }}
      loop: "{{ vlan_plan }}"
      when: item.name not in existing_names
      loop_control:
        label: "{{ item.role }} {{ item.name }}"

    - name: Create Management Broadcast Domain
      netapp.ontap.na_ontap_broadcast_domain:
        state: present
        name: "{{ item.name }}"
        ipspace: "{{ ipspace_name_normalized }}"
        mtu: "{{ item.mtu | int }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      loop: "{{ vlan_plan }}"
      when: item.protocol == 'management'
      loop_control:
        label: "{{ item.role }} {{ item.name }} MTU {{ item.mtu }}"

    - name: Create NFS broadcast domain ports with Jumbo frames
      netapp.ontap.na_ontap_broadcast_domain:
        state: present
        name: "{{ item.name }}"
        ipspace: "{{ ipspace_name_normalized }}"
        mtu: "{{ item.mtu | int }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      loop: "{{ vlan_plan }}"
      when: item.protocol == 'NFS'
      loop_control:
        label: "{{ item.protocol }} {{ item.name }} MTU {{ item.mtu }}"

    - name: Create iSCSI broadcast domain ports with Jumbo frames
      netapp.ontap.na_ontap_broadcast_domain:
        state: present
        name: "{{ item.name }}"
        ipspace: "{{ ipspace_name_normalized }}"
        mtu: "{{ item.mtu | int }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      loop: "{{ vlan_plan }}"
      when: item.protocol == 'iSCSI'
      loop_control:
        label: "{{ item.protocol }} fabric {{ item.fabric }} {{ item.name }} MTU {{ item.mtu }}"

    - name: Keep broadcast domains this deployment already created
      ansible.builtin.set_fact:
        added_objects: "{{ incoming_prior.added | default([]) }}"
      when: incoming_prior.changed | default(false) | bool

    - name: Start a new broadcast-domain list when this deployment has not created one
      ansible.builtin.set_fact:
        added_objects: []
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Add broadcast domains that were not already on the cluster
      ansible.builtin.set_fact:
        added_objects: "{{ added_objects + [item] }}"
      loop: "{{ added_now | default([]) }}"
      when: item.id not in (added_objects | map(attribute='id') | list)

    - name: Export the broadcast domains this deployment created
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ {'changed': (added_objects | length > 0), 'added': added_objects} | to_json }}"
