---
# Undo of zero_spare_disks.yaml.
# Zeroing a spare disk cannot be reversed. End reports that and leaves the
# disks as they are.
- name: Report spare-disk zeroing on End
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Note that spare-disk zeroing cannot be reversed
      ansible.builtin.debug:
        msg: >-
          Spare disks zeroed by this deployment cannot be restored.
          End leaves the disks as they are.
