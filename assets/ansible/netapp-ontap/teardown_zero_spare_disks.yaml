---
# Undo of zero_spare_disks.yaml.
# Zeroing a spare disk cannot be reversed. End reports that and leaves the
# disks as they are. When this grain found every spare already zeroed, End
# makes no change.
- name: Report spare-disk zeroing on End
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (
            prior_config | string | trim
            | replace('&quot;', '"')
            | replace('&#34;', '"')
            | replace('&amp;', '&')
            | replace('&#39;', "'")
            | replace('&apos;', "'")
            | replace('&lt;', '<')
            | replace('&gt;', '>')
          )
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Note that no unzeroed spare was found
      ansible.builtin.debug:
        msg: No unzeroed spare disk was found, so End makes no change.
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Note that spare-disk zeroing cannot be reversed
      ansible.builtin.debug:
        msg: >-
          Spare disks were zeroed by this deployment. That cannot be reversed,
          so End leaves the disks as they are.
      when: incoming_prior.changed | default(false) | bool
