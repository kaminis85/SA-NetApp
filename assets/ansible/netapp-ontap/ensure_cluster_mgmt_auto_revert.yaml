---
- name: Ensure auto-revert on the cluster management interface
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (prior_config | string | trim)
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Get IP interfaces
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - network/ip/interfaces
        fields:
          - name
          - scope
          - service_policy
          - location.failover
      register: interface_info
      no_log: true

    - name: Select cluster management interfaces
      ansible.builtin.set_fact:
        cluster_mgmt_interfaces: "{{ cluster_mgmt_interfaces | default([]) + [item.name] }}"
      vars:
        policy_name: "{{ (item.service_policy | default({})).name | default('') }}"
        failover_policy: "{{ (item.location | default({})).failover | default('') }}"
      when:
        - item.scope | default('') == 'cluster'
        - policy_name == 'default-management'
        - failover_policy == 'broadcast_domain_only'
      loop: "{{ interface_info.ontap_info.network_ip_interfaces.records | default([]) }}"
      loop_control:
        label: "{{ item.name | default('unnamed interface') }}"

    - name: Validate the cluster management interface
      ansible.builtin.assert:
        that:
          - cluster_mgmt_interfaces | default([]) | length > 0
        fail_msg: The cluster did not return a cluster management interface.

    - name: Read auto-revert on the cluster management interface
      netapp.ontap.na_ontap_rest_cli:
        command: network/interface
        verb: GET
        params:
          lif: "{{ item }}"
          fields: lif,auto-revert
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: "{{ cluster_mgmt_interfaces | unique | sort }}"
      loop_control:
        label: "{{ item }}"
      register: auto_revert_show

    - name: Record auto-revert
      ansible.builtin.set_fact:
        live_value: "{{ (live_value | default([])) + [row] }}"
      vars:
        revert_record: >-
          {{
            (item.msg.records | default([item.msg | default({})]))
            | first
            | default({})
          }}
        revert_flag: >-
          {{
            revert_record.auto_revert
            | default(revert_record['auto-revert'] | default(revert_record.is_auto_revert | default('')))
            | string
            | trim
            | lower
          }}
        row:
          name: "{{ item.item }}"
          auto_revert: "{{ revert_flag }}"
      loop: "{{ auto_revert_show.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Confirm auto-revert was read
      ansible.builtin.assert:
        that:
          - item.auto_revert in ['true', 'false']
        fail_msg: >-
          Could not read auto-revert for {{ item.name }}.
          The cluster returned '{{ item.auto_revert }}'.
      loop: "{{ live_value }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Build the auto-revert value this launch applies
      ansible.builtin.set_fact:
        applied_value: "{{ (applied_value | default([])) + [{'name': item.name, 'auto_revert': 'true'}] }}"
      loop: "{{ live_value }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Record whether auto-revert still needs to change
      ansible.builtin.set_fact:
        changed_now: "{{ live_value != applied_value }}"
        keep_original: >-
          {{
            (incoming_prior.changed | default(false) | bool)
            and (
              (live_value != applied_value)
              or (
                (incoming_prior.applied is defined)
                and (live_value == incoming_prior.applied)
              )
            )
          }}

    - name: Ensure auto-revert is set for the cluster management interface
      netapp.ontap.na_ontap_interface:
        is_auto_revert: true
        interface_name: "{{ item }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: "{{ cluster_mgmt_interfaces | unique }}"
      loop_control:
        label: "{{ item }}"

    - name: Keep the earlier auto-revert values when this launch did not find a new change
      ansible.builtin.set_fact:
        prior_export:
          changed: true
          previous: "{{ incoming_prior.previous }}"
          applied: "{{ applied_value }}"
      when: keep_original | bool

    - name: Record the auto-revert values from this launch
      ansible.builtin.set_fact:
        prior_export:
          changed: "{{ changed_now | bool }}"
          previous: "{{ live_value }}"
          applied: "{{ applied_value }}"
      when: not (keep_original | bool)

    - name: Export the recorded auto-revert change
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ prior_export | to_json }}"
