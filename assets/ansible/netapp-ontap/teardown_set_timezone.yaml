---
# Undo of set_timezone.yaml.
# The form has the timezone this deployment set, not the timezone that was
# there before. End does not guess a timezone, and it does not rename the
# cluster. Safe to run twice.
- name: Leave the ONTAP cluster timezone in place
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_rest_info:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
      use_python_keys: true

  tasks:

    - name: Read the cluster
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - cluster
        fields:
          - name
          - timezone
      register: cluster_info

    - name: Record the cluster name and timezone
      ansible.builtin.set_fact:
        live_name: "{{ cluster_record.name | default('') | string | trim }}"
        live_timezone: "{{ (cluster_record.timezone | default({})).name | default('') | string | trim }}"
      vars:
        cluster_body: "{{ cluster_info.ontap_info.cluster | default({}) }}"
        cluster_record: >-
          {{
            cluster_body
            if (cluster_body.name | default('') | string | length > 0)
            else ((cluster_body.records | default([{}])) | first | default({}))
          }}

    - name: Confirm the cluster was read
      ansible.builtin.assert:
        that:
          - live_name | length > 0
        fail_msg: The cluster did not return its name.

    - name: Report that End leaves the timezone in place
      ansible.builtin.debug:
        msg: >-
          The cluster timezone is '{{ live_timezone }}'. The form does not
          include the previous timezone, so End leaves the name
          '{{ live_name }}' and the timezone unchanged.
