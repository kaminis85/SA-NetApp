---
# Undo of configure_autosupport.yaml: put AutoSupport back to the ONTAP day-0
# defaults on nodes whose mail hosts, from address, and to addresses still
# match the form. Day-0 is mail host "mailhost", from "Postmaster", and no to
# addresses. AutoSupport stays enabled. Safe to run twice.
- name: Restore ONTAP AutoSupport day-0 defaults
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_rest_info:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
      use_python_keys: true
    netapp.ontap.na_ontap_autosupport:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
  vars:
    mail_host_list: "{{ (autosupport_mail_hosts | default('') | string).split(',') | map('trim') | reject('equalto', '') | list }}"
    to_address_list: "{{ (autosupport_to_addresses | default('') | string).split(',') | map('trim') | reject('equalto', '') | list }}"
    from_requested: "{{ autosupport_from_address | default('') | string | trim }}"

  tasks:

    - name: Note that AutoSupport was not named on the form
      ansible.builtin.debug:
        msg: AutoSupport mail settings were not named, so End leaves AutoSupport unchanged.
      when: mail_host_list | length == 0 or to_address_list | length == 0 or from_requested | length == 0

    - name: Stop when AutoSupport was not named on the form
      when: mail_host_list | length == 0 or to_address_list | length == 0 or from_requested | length == 0
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Discover ONTAP cluster nodes
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - cluster/nodes
        fields:
          - name
      register: node_info

    - name: Read AutoSupport
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - support/autosupport
        # Configuration is cluster-scoped. "node" is not a valid field and
        # ONTAP rejects the query with error 262197.
        fields:
          - mail_hosts
          - from
          - to
      register: autosupport_info

    - name: Build the node list
      ansible.builtin.set_fact:
        node_list: >-
          {{
            node_info.ontap_info.cluster_nodes.records
            | default([])
            | map(attribute='name')
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | list
          }}
        autosupport_records: >-
          {{
            (autosupport_info.ontap_info.support_autosupport | default({})).records
            | default([autosupport_info.ontap_info.support_autosupport | default({})])
          }}

    - name: Validate discovered nodes
      ansible.builtin.assert:
        that:
          - node_list | length > 0
        fail_msg: The cluster did not return any node names.

    - name: Select nodes whose AutoSupport still matches the form
      ansible.builtin.set_fact:
        nodes_to_clear: "{{ nodes_to_clear | default([]) + [item] }}"
      vars:
        node_records: >-
          {{
            autosupport_records
            | selectattr('node', 'defined')
            | selectattr('node.name', 'equalto', item)
            | list
          }}
        source_record: "{{ (node_records | first) if (node_records | length > 0) else (autosupport_records | first | default({})) }}"
        live_mail: "{{ source_record.mail_hosts | default([]) | map('string') | map('trim') | reject('equalto', '') | sort }}"
        live_to: "{{ source_record.to | default([]) | map('string') | map('trim') | reject('equalto', '') | sort }}"
        live_from: "{{ source_record['from'] | default('') | string | trim }}"
      loop: "{{ node_list }}"
      when:
        - live_mail == (mail_host_list | sort)
        - live_to == (to_address_list | sort)
        - live_from == from_requested
      loop_control:
        label: "{{ item }}"

    - name: Note that AutoSupport no longer matches the form
      ansible.builtin.debug:
        msg: AutoSupport no longer matches the form, so End leaves it unchanged.
      when: nodes_to_clear | default([]) | length == 0

    - name: Stop when AutoSupport no longer matches the form
      when: nodes_to_clear | default([]) | length == 0
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Restore AutoSupport day-0 defaults on the matching nodes
      netapp.ontap.na_ontap_autosupport:
        state: present
        node_name: "{{ item }}"
        mail_hosts:
          - mailhost
        from_address: Postmaster
        to_addresses: []
        proxy_url: "{{ '' if (autosupport_proxy_url | default('') | string | trim | length > 0) else omit }}"
      loop: "{{ nodes_to_clear }}"
      loop_control:
        label: "{{ item }}"

    - name: Report the nodes
      ansible.builtin.debug:
        msg: "Restored AutoSupport to the ONTAP day-0 defaults (mail host mailhost, from Postmaster, and no to addresses) on {{ nodes_to_clear | join(', ') }}. AutoSupport stays enabled."
