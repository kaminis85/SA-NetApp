---
- name: Create the ONTAP cluster login banner
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (
            prior_config | string | trim
            | replace('&quot;', '"')
            | replace('&#34;', '"')
            | replace('&amp;', '&')
            | replace('&#39;', "'")
            | replace('&apos;', "'")
            | replace('&lt;', '<')
            | replace('&gt;', '>')
          )
        )
      }}

  tasks:

    - name: Validate the login banner
      ansible.builtin.assert:
        that:
          - cluster_login_banner | default('') | length > 0
        fail_msg: Provide cluster_login_banner.

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Read the cluster login banner
      netapp.ontap.na_ontap_rest_cli:
        command: security/login/banner
        verb: GET
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      register: banner_show

    - name: Record the login banner
      ansible.builtin.set_fact:
        live_value: >-
          {{
            (
              (banner_show.msg.records | default([banner_show.msg | default({})]) | first | default({})).message
              | default('')
            ) | string
          }}
        applied_value: "{{ cluster_login_banner | string }}"

    - name: Record whether the banner still needs to change
      ansible.builtin.set_fact:
        changed_now: "{{ live_value != applied_value }}"
        keep_original: >-
          {{
            (incoming_prior.changed | default(false) | bool)
            and (
              (live_value != applied_value)
              or (
                (incoming_prior.applied is defined)
                and (live_value == incoming_prior.applied)
              )
            )
          }}

    - name: Create the login banner for the ONTAP cluster
      netapp.ontap.na_ontap_login_messages:
        banner: "{{ cluster_login_banner }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false

    - name: Keep the earlier banner when this launch did not find a new change
      ansible.builtin.set_fact:
        prior_export:
          changed: true
          previous: "{{ incoming_prior.previous }}"
          applied: "{{ applied_value }}"
      when: keep_original | bool

    - name: Record the banner from this launch
      ansible.builtin.set_fact:
        prior_export:
          changed: "{{ changed_now | bool }}"
          previous: "{{ live_value }}"
          applied: "{{ applied_value }}"
      when: not (keep_original | bool)

    - name: Export the recorded banner change
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ prior_export | to_json }}"
