---
# Undo of ensure_cluster_mgmt_auto_revert.yaml: turn auto-revert off on the
# cluster management interface. Safe to run twice.
- name: Disable cluster management auto-revert
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_rest_info:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
      use_python_keys: true
    netapp.ontap.na_ontap_rest_cli:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
    netapp.ontap.na_ontap_interface:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false

  tasks:

    - name: Get IP interfaces
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - network/ip/interfaces
        fields:
          - name
          - scope
          - service_policy
          - location.failover
      register: interface_info

    - name: Select cluster management interfaces
      ansible.builtin.set_fact:
        cluster_mgmt_interfaces: "{{ cluster_mgmt_interfaces | default([]) + [item.name] }}"
      vars:
        policy_name: "{{ (item.service_policy | default({})).name | default('') }}"
        failover_policy: "{{ (item.location | default({})).failover | default('') }}"
      when:
        - item.scope | default('') == 'cluster'
        - policy_name == 'default-management'
        - failover_policy == 'broadcast_domain_only'
      loop: "{{ interface_info.ontap_info.network_ip_interfaces.records | default([]) }}"
      loop_control:
        label: "{{ item.name | default('unnamed interface') }}"

    - name: Validate the cluster management interface
      ansible.builtin.assert:
        that:
          - cluster_mgmt_interfaces | default([]) | length > 0
        fail_msg: The cluster did not return a cluster management interface.

    - name: Read auto-revert on the cluster management interface
      netapp.ontap.na_ontap_rest_cli:
        command: network/interface
        verb: GET
        params:
          lif: "{{ item }}"
          fields: lif,auto-revert
      loop: "{{ cluster_mgmt_interfaces | unique | sort }}"
      loop_control:
        label: "{{ item }}"
      register: auto_revert_show

    - name: Select interfaces that still have auto-revert on
      ansible.builtin.set_fact:
        interfaces_to_disable: "{{ interfaces_to_disable | default([]) + [item.item] }}"
      vars:
        revert_record: >-
          {{
            (item.msg.records | default([item.msg | default({})]))
            | first
            | default({})
          }}
        revert_flag: >-
          {{
            revert_record.auto_revert
            | default(revert_record['auto-revert'] | default(revert_record.is_auto_revert | default('')))
            | string
            | trim
            | lower
          }}
      loop: "{{ auto_revert_show.results }}"
      when: revert_flag in ['true', 'on']
      loop_control:
        label: "{{ item.item }}"

    - name: Note that auto-revert is already off
      ansible.builtin.debug:
        msg: Auto-revert is already off on the cluster management interface, so End leaves it unchanged.
      when: interfaces_to_disable | default([]) | length == 0

    - name: Stop when auto-revert is already off
      when: interfaces_to_disable | default([]) | length == 0
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Turn auto-revert off
      netapp.ontap.na_ontap_interface:
        is_auto_revert: false
        interface_name: "{{ item }}"
      loop: "{{ interfaces_to_disable }}"
      loop_control:
        label: "{{ item }}"

    - name: Report the interfaces
      ansible.builtin.debug:
        msg: "Turned auto-revert off on {{ interfaces_to_disable | join(', ') }}."
