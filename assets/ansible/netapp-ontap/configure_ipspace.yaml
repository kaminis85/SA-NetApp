# The IPspace name is checked just before the IPspace is created.
# Broadcast domains and VLAN interfaces are separate tasks.
# End deletes this IPspace only when this deployment created it.
- name: Create the ONTAP IPspace
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ipspace_name_normalized: "{{ ipspace_name | default('') | string | trim }}"
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (prior_config | string | trim)
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Validate the IPspace name
      ansible.builtin.assert:
        that:
          - ipspace_name_normalized | length > 0
          - ipspace_name_normalized is match('^[A-Za-z_][A-Za-z0-9_.-]{0,63}$')
          - ipspace_name_normalized | lower not in ['default', 'cluster']
        fail_msg: >-
          IPspace name must start with a letter or underscore and contain only
          letters, numbers, underscores, hyphens, and periods. Default and
          Cluster already exist and cannot be used here.

    - name: Read the IPspace
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - network/ipspaces
        parameters:
          name: "{{ ipspace_name_normalized }}"
        fields:
          - name
      register: ipspace_lookup

    - name: Record the IPspace when it is not already present
      ansible.builtin.set_fact:
        added_now: "{{ added_now | default([]) + [row] }}"
      vars:
        row:
          id: "{{ ipspace_name_normalized }}"
          name: "{{ ipspace_name_normalized }}"
        existing_names: >-
          {{
            ((ipspace_lookup.ontap_info | default({})).network_ipspaces | default({})).records
            | default([])
            | map(attribute='name')
            | map('string')
            | list
          }}
      when: ipspace_name_normalized not in existing_names

    - name: Create the IPspace
      netapp.ontap.na_ontap_ipspace:
        state: present
        name: "{{ ipspace_name_normalized }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always

    - name: Keep IPspaces this deployment already created
      ansible.builtin.set_fact:
        added_objects: "{{ incoming_prior.added | default([]) }}"
      when: incoming_prior.changed | default(false) | bool

    - name: Start a new IPspace list when this deployment has not created one
      ansible.builtin.set_fact:
        added_objects: []
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Add the IPspace when it was not already on the cluster
      ansible.builtin.set_fact:
        added_objects: "{{ added_objects + [item] }}"
      loop: "{{ added_now | default([]) }}"
      when: item.id not in (added_objects | map(attribute='id') | list)

    - name: Export the IPspaces this deployment created
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ {'changed': (added_objects | length > 0), 'added': added_objects} | to_json }}"
