---
# Undo of configure_fips.yaml: set SSL FIPS mode to the opposite of the form
# when the cluster still has the value the form set. Safe to run twice.
- name: Restore SSL FIPS mode
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_rest_cli:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
    netapp.ontap.na_ontap_security_config:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
  vars:
    fips_requested: "{{ is_fips_enabled | default('') | string | trim | lower }}"

  tasks:

    - name: Note that FIPS was not set on the form
      ansible.builtin.debug:
        msg: The form did not set FIPS to true or false, so End leaves it unchanged.
      when: fips_requested not in ['true', 'false']

    - name: Stop when FIPS was not set on the form
      when: fips_requested not in ['true', 'false']
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    # Same query as: security config show -interface SSL -fields is-fips-enabled
    - name: Read SSL FIPS mode
      netapp.ontap.na_ontap_rest_cli:
        command: security/config
        verb: GET
        params:
          privilege_level: advanced
          interface: SSL
          fields: is-fips-enabled
      register: fips_show

    # Store enabled/disabled. set_fact turns the strings true and false into
    # booleans, and the confirm task then rejects a value the cluster did return.
    - name: Record SSL FIPS mode
      ansible.builtin.set_fact:
        live_value: >-
          {{
            'enabled' if ((fips_text | string | lower) == 'true')
            else (
              'disabled' if ((fips_text | string | lower) == 'false')
              else (fips_text | string)
            )
          }}
        restore_value: "{{ 'disabled' if (fips_requested == 'true') else 'enabled' }}"
      vars:
        ssl_record: "{{ (fips_show.msg.records | default([fips_show.msg | default({})])) | first | default({}) }}"
        fips_text: >-
          {{
            (
              ssl_record.is_fips_enabled
              | default(ssl_record['is-fips-enabled'] | default(''))
            ) | string | trim | lower
          }}

    - name: Confirm SSL FIPS mode was read
      ansible.builtin.assert:
        that:
          - live_value in ['enabled', 'disabled']
        fail_msg: "Could not read SSL FIPS mode. The cluster returned '{{ live_value }}'."

    - name: Note that FIPS no longer matches the form
      ansible.builtin.debug:
        msg: >-
          SSL FIPS mode is {{ 'true' if (live_value == 'enabled') else 'false' }},
          not {{ fips_requested }}, so End leaves it unchanged.
      when: (live_value == 'enabled') != (fips_requested == 'true')

    - name: Stop when FIPS no longer matches the form
      when: (live_value == 'enabled') != (fips_requested == 'true')
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Set SSL FIPS mode
      netapp.ontap.na_ontap_security_config:
        name: ssl
        is_fips_enabled: "{{ restore_value == 'enabled' }}"

    - name: Report the SSL FIPS mode
      ansible.builtin.debug:
        msg: "SSL FIPS mode is now {{ 'true' if (restore_value == 'enabled') else 'false' }}."
