# Nodes and data ports come from the node configuration table.
# The VLAN parent is the interface group name.
# Each network below is one entry from the FlexPod VLAN list:
#   in-band management has no storage protocol and no fabric, MTU 1500
#   NFS is storage protocol NFS and has no fabric, MTU 9000
#   iSCSI-A is storage protocol iSCSI, fabric A, MTU 9000
#   iSCSI-B is storage protocol iSCSI, fabric B, MTU 9000
# Fabric is not sent to ONTAP. It distinguishes the two iSCSI VLANs.
# A network is skipped when its VLAN name or VLAN ID is blank.
# The interface group name and node names are checked just before the
# VLAN interfaces are created.
- name: Create ONTAP VLAN interfaces
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ipspace_name_normalized: "{{ ipspace_name | default('') | string | trim }}"
    ifgrp_name_normalized: "{{ ifgrp_name | default('') | string | trim | lower }}"
    node_rows: >-
      {{
        [] if (node_specs | default('[]') | string | trim) in ['', '[]']
        else (node_specs | from_json if node_specs is string else node_specs)
      }}
    network_inputs:
      - role: In-band management
        protocol: management
        fabric: ""
        name: "{{ ib_mgmt_vlan_name | default('') | string | trim }}"
        id: "{{ ib_mgmt_vlan_id | default('') | string | trim }}"
        mtu: 1500
      - role: NFS
        protocol: NFS
        fabric: ""
        name: "{{ nfs_vlan_name | default('') | string | trim }}"
        id: "{{ nfs_vlan_id | default('') | string | trim }}"
        mtu: 9000
      - role: iSCSI-A
        protocol: iSCSI
        fabric: A
        name: "{{ iscsi_a_vlan_name | default('') | string | trim }}"
        id: "{{ iscsi_a_vlan_id | default('') | string | trim }}"
        mtu: 9000
      - role: iSCSI-B
        protocol: iSCSI
        fabric: B
        name: "{{ iscsi_b_vlan_name | default('') | string | trim }}"
        id: "{{ iscsi_b_vlan_id | default('') | string | trim }}"
        mtu: 9000
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (prior_config | string | trim)
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Skip a network when its VLAN name or VLAN ID is blank
      ansible.builtin.debug:
        msg: >-
          {{ item.role }} is skipped because its VLAN name or VLAN ID is blank.
      loop: "{{ network_inputs }}"
      when: (item.name | length > 0) != (item.id | length > 0)
      loop_control:
        label: "{{ item.role }}"

    - name: Select networks that have both a VLAN name and a VLAN ID
      ansible.builtin.set_fact:
        vlan_plan: "{{ network_inputs | selectattr('name') | selectattr('id') | list }}"

    - name: Note that no VLAN was requested
      ansible.builtin.debug:
        msg: No VLAN has both a name and an ID, so no VLAN interface was created.
      when: vlan_plan | length == 0

    - name: Keep the earlier VLAN record when no VLAN was requested
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ incoming_prior | to_json }}"
      when:
        - vlan_plan | length == 0
        - incoming_prior.changed | default(false) | bool

    - name: Record that no VLAN interface was changed
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ {'changed': false} | to_json }}"
      when:
        - vlan_plan | length == 0
        - not (incoming_prior.changed | default(false) | bool)

    - name: Stop when no VLAN was requested
      ansible.builtin.meta: end_play
      when: vlan_plan | length == 0

    - name: Note that VLAN interfaces were skipped because the interface group name is blank
      ansible.builtin.debug:
        msg: The interface group name is blank, so the VLAN interfaces were skipped.
      when: ifgrp_name_normalized | length == 0

    - name: Keep the earlier VLAN record when the interface group name is blank
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ incoming_prior | to_json }}"
      when:
        - ifgrp_name_normalized | length == 0
        - incoming_prior.changed | default(false) | bool

    - name: Record that no VLAN interface was changed because the interface group name is blank
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ {'changed': false} | to_json }}"
      when:
        - ifgrp_name_normalized | length == 0
        - not (incoming_prior.changed | default(false) | bool)

    - name: Stop when the interface group name is blank
      ansible.builtin.meta: end_play
      when: ifgrp_name_normalized | length == 0

    - name: Normalize node rows
      ansible.builtin.set_fact:
        node_plan: "{{ node_plan | default([]) + [normalized_row] }}"
      vars:
        ports_raw: "{{ item.ports | default(item['Data Ports'], true) | default('', true) }}"
        normalized_row:
          node_name: "{{ item.node_name | default(item['Node Name'], true) | default('', true) | trim }}"
          ports: >-
            {{
              (
                ports_raw
                if ports_raw is not string
                else ports_raw.split(',') | map('trim') | reject('equalto', '') | list
              ) | unique | list
            }}
      loop: "{{ node_rows }}"
      loop_control:
        label: "{{ item.node_name | default(item['Node Name'], true) | default('unnamed row', true) }}"

    - name: Select nodes that list data ports
      ansible.builtin.set_fact:
        port_plan: "{{ port_plan | default([]) + [item] }}"
      loop: "{{ node_plan | default([]) }}"
      when: item.ports | length > 0
      loop_control:
        label: "{{ item.node_name }}"

    - name: Note nodes that have no data ports
      ansible.builtin.debug:
        msg: >-
          {{ item.node_name }} lists no data ports, so it will not receive
          these VLANs. VLANs are added to the interface group, which is
          created only on nodes that list data ports.
      loop: "{{ node_plan | default([]) }}"
      when: item.ports | length == 0
      loop_control:
        label: "{{ item.node_name }}"

    - name: Note that VLAN interfaces were skipped because no node lists data ports
      ansible.builtin.debug:
        msg: No node lists data ports, so the VLAN interfaces were skipped.
      when: port_plan | default([]) | length == 0

    - name: Keep the earlier VLAN record when no node lists data ports
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ incoming_prior | to_json }}"
      when:
        - port_plan | default([]) | length == 0
        - incoming_prior.changed | default(false) | bool

    - name: Record that no VLAN interface was changed because no node lists data ports
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ {'changed': false} | to_json }}"
      when:
        - port_plan | default([]) | length == 0
        - not (incoming_prior.changed | default(false) | bool)

    - name: Stop when no node lists data ports
      ansible.builtin.meta: end_play
      when: port_plan | default([]) | length == 0

    - name: Validate VLAN IDs
      ansible.builtin.assert:
        that:
          - item.id is match('^[1-9][0-9]{0,3}$')
          - item.id | int <= 4094
        fail_msg: "{{ item.role }} VLAN ID must be a number from 1 to 4094."
      loop: "{{ vlan_plan }}"
      loop_control:
        label: "{{ item.role }}"

    - name: Validate VLAN names
      ansible.builtin.assert:
        that:
          - item.name is match('^[A-Za-z_][A-Za-z0-9_.-]{0,63}$')
          - item.name | lower not in ['default', 'cluster']
        fail_msg: >-
          {{ item.role }} VLAN name must start with a letter or underscore and
          contain only letters, numbers, underscores, hyphens, and periods.
          Default and Cluster are reserved.
      loop: "{{ vlan_plan }}"
      loop_control:
        label: "{{ item.role }}"

    - name: Validate that VLAN names are unique
      ansible.builtin.assert:
        that:
          - vlan_plan | map(attribute='name') | map('lower') | unique | list | length == vlan_plan | length
        fail_msg: >-
          VLAN names must be unique. Requested names:
          {{ vlan_plan | map(attribute='name') | join(', ') }}.

    - name: Validate that VLAN IDs are unique
      ansible.builtin.assert:
        that:
          - vlan_plan | map(attribute='id') | unique | list | length == vlan_plan | length
        fail_msg: >-
          VLAN IDs must be unique. Requested IDs:
          {{ vlan_plan | map(attribute='id') | join(', ') }}.

    - name: Validate the interface group name
      ansible.builtin.assert:
        that:
          - ifgrp_name_normalized is match('^a(0|[1-9][0-9]{0,2})[a-z]$')
        fail_msg: >-
          Interface group name must look like a0a: the letter a, a number from
          0 to 999 with no leading zeros, and one lowercase letter.

    - name: Validate node names on rows that list data ports
      ansible.builtin.assert:
        that:
          - item.node_name | length > 0
        fail_msg: >-
          Row {{ ansible_loop.index }} lists data ports and needs a node name.
      loop: "{{ node_plan | default([]) }}"
      when: item.ports | length > 0
      loop_control:
        extended: true
        label: "{{ item.node_name | default('row ' ~ ansible_loop.index) }}"

    - name: Validate that each node appears once
      ansible.builtin.assert:
        that:
          - port_plan | map(attribute='node_name') | unique | list | length == port_plan | length
        fail_msg: >-
          Each node name can appear only once. Requested names:
          {{ port_plan | map(attribute='node_name') | join(', ') }}.

    # broadcast_domain and ipspace are applied only when this module uses REST.
    - name: Read Ethernet ports
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - network/ethernet/ports
        fields:
          - name
          - node
          - type
      register: vlan_port_info

    - name: Record VLAN interfaces that already exist
      ansible.builtin.set_fact:
        existing_vlan_keys: "{{ existing_vlan_keys | default([]) + [port_key] }}"
      vars:
        node_name: "{{ (item.node | default({})).name | default('') }}"
        port_key: "{{ node_name }}/{{ item.name | default('') }}"
      loop: "{{ ((vlan_port_info.ontap_info | default({})).network_ethernet_ports | default({})).records | default([]) }}"
      when:
        - node_name | length > 0
        - item.name | default('') | length > 0
      loop_control:
        label: "{{ port_key }}"

    - name: Record VLAN interfaces that are not already present
      ansible.builtin.set_fact:
        added_now: "{{ added_now | default([]) + [row] }}"
      vars:
        port_name: "{{ ifgrp_name_normalized }}-{{ item.1.id }}"
        port_key: "{{ item.0.node_name }}/{{ port_name }}"
        row:
          id: "{{ port_key }}"
          node_name: "{{ item.0.node_name }}"
          parent: "{{ ifgrp_name_normalized }}"
          vlan_id: "{{ item.1.id | int }}"
          port_name: "{{ port_name }}"
          port_key: "{{ port_key }}"
          role: "{{ item.1.role }}"
      loop: "{{ port_plan | product(vlan_plan) | list }}"
      when: port_key not in (existing_vlan_keys | default([]))
      loop_control:
        label: "{{ item.0.node_name }}/{{ ifgrp_name_normalized }}-{{ item.1.id }}"

    - name: Create the management VLAN and add it to the management broadcast domain
      netapp.ontap.na_ontap_net_vlan:
        state: present
        node: "{{ item.0.node_name }}"
        parent_interface: "{{ ifgrp_name_normalized }}"
        vlanid: "{{ item.1.id | int }}"
        broadcast_domain: "{{ item.1.name }}"
        ipspace: "{{ ipspace_name_normalized }}"
        enabled: true
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      loop: "{{ port_plan | product(vlan_plan) | list }}"
      when: item.1.protocol == 'management'
      loop_control:
        label: "{{ item.0.node_name }}/{{ ifgrp_name_normalized }}-{{ item.1.id }} {{ item.1.role }}"

    - name: Create the NFS VLANs and add them to the NFS broadcast domains
      netapp.ontap.na_ontap_net_vlan:
        state: present
        node: "{{ item.0.node_name }}"
        parent_interface: "{{ ifgrp_name_normalized }}"
        vlanid: "{{ item.1.id | int }}"
        broadcast_domain: "{{ item.1.name }}"
        ipspace: "{{ ipspace_name_normalized }}"
        enabled: true
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      loop: "{{ port_plan | product(vlan_plan) | list }}"
      when: item.1.protocol == 'NFS'
      loop_control:
        label: "{{ item.0.node_name }}/{{ ifgrp_name_normalized }}-{{ item.1.id }} {{ item.1.protocol }}"

    - name: Create the iSCSI VLANs and add them to the iSCSI broadcast domains
      netapp.ontap.na_ontap_net_vlan:
        state: present
        node: "{{ item.0.node_name }}"
        parent_interface: "{{ ifgrp_name_normalized }}"
        vlanid: "{{ item.1.id | int }}"
        broadcast_domain: "{{ item.1.name }}"
        ipspace: "{{ ipspace_name_normalized }}"
        enabled: true
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      loop: "{{ port_plan | product(vlan_plan) | list }}"
      when: item.1.protocol == 'iSCSI'
      loop_control:
        label: "{{ item.0.node_name }}/{{ ifgrp_name_normalized }}-{{ item.1.id }} {{ item.1.protocol }} fabric {{ item.1.fabric }}"

    - name: Keep VLAN interfaces this deployment already created
      ansible.builtin.set_fact:
        added_objects: "{{ incoming_prior.added | default([]) }}"
      when: incoming_prior.changed | default(false) | bool

    - name: Start a new VLAN list when this deployment has not created one
      ansible.builtin.set_fact:
        added_objects: []
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Add VLAN interfaces that were not already on the cluster
      ansible.builtin.set_fact:
        added_objects: "{{ added_objects + [item] }}"
      loop: "{{ added_now | default([]) }}"
      when: item.id not in (added_objects | map(attribute='id') | list)

    - name: Export the VLAN interfaces this deployment created
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ {'changed': (added_objects | length > 0), 'added': added_objects} | to_json }}"
