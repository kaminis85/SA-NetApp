---
# Undo of enable_storage_failover.yaml: disable storage-failover takeover on
# each node where it is enabled. Safe to run twice.
- name: Disable ONTAP storage failover
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_rest_info:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
      use_python_keys: true
    netapp.ontap.na_ontap_rest_cli:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false

  tasks:

    - name: Discover ONTAP cluster nodes
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - cluster/nodes
        fields:
          - name
      register: node_info

    - name: Build the node list
      ansible.builtin.set_fact:
        node_list: >-
          {{
            node_info.ontap_info.cluster_nodes.records
            | default([])
            | map(attribute='name')
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | list
          }}

    - name: Validate discovered nodes
      ansible.builtin.assert:
        that:
          - node_list | length > 0
        fail_msg: The cluster did not return any node names.

    - name: Read storage failover
      netapp.ontap.na_ontap_rest_cli:
        command: storage/failover
        verb: GET
        params:
          node: "{{ item }}"
          fields: node,enabled
      loop: "{{ node_list }}"
      loop_control:
        label: "{{ item }}"
      register: failover_show

    - name: Select nodes that still have takeover enabled
      ansible.builtin.set_fact:
        nodes_to_disable: "{{ nodes_to_disable | default([]) + [item.item] }}"
      vars:
        failover_record: >-
          {{
            (item.msg.records | default([item.msg | default({})]))
            | first
            | default({})
          }}
        enabled_flag: >-
          {{
            failover_record.enabled
            | default('')
            | string
            | trim
            | lower
          }}
      loop: "{{ failover_show.results }}"
      when: enabled_flag in ['true', 'on']
      loop_control:
        label: "{{ item.item }}"

    - name: Note that storage failover is already disabled
      ansible.builtin.debug:
        msg: Storage failover takeover is already disabled, so End leaves it unchanged.
      when: nodes_to_disable | default([]) | length == 0

    - name: Stop when storage failover is already disabled
      when: nodes_to_disable | default([]) | length == 0
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Disable takeover for storage failover
      netapp.ontap.na_ontap_rest_cli:
        command: "storage/failover/objects/{{ item }}"
        verb: PATCH
        body:
          enabled: "false"
      loop: "{{ nodes_to_disable }}"
      loop_control:
        label: "{{ item }}"

    - name: Report the nodes
      ansible.builtin.debug:
        msg: "Disabled storage failover takeover on {{ nodes_to_disable | join(', ') }}."
