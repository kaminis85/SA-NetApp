---
# Undo of disable_flow_control.yaml: set flow control back to full on the
# data ports named on the form when those ports are currently none.
# Safe to run twice.
- name: Restore flow control on ONTAP data ports
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_rest_cli:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
  vars:
    node_rows: >-
      {{
        [] if (node_specs | default('[]') | string | trim) in ['', '[]']
        else (node_specs | from_json if node_specs is string else node_specs)
      }}

  tasks:

    - name: Normalize node rows
      ansible.builtin.set_fact:
        node_plan: "{{ node_plan | default([]) + [normalized_row] }}"
      vars:
        ports_raw: "{{ item.ports | default(item['Data Ports'], true) | default('', true) }}"
        normalized_row:
          node_name: "{{ item.node_name | default(item['Node Name'], true) | default('', true) | trim }}"
          ports: >-
            {{
              ports_raw
              if ports_raw is not string
              else ports_raw.split(',') | map('trim') | reject('equalto', '') | list
            }}
      loop: "{{ node_rows }}"
      loop_control:
        label: "{{ item.node_name | default(item['Node Name'], true) | default('unnamed row', true) }}"

    - name: Select nodes that list data ports
      ansible.builtin.set_fact:
        port_plan: "{{ port_plan | default([]) + [item] }}"
      loop: "{{ node_plan | default([]) }}"
      when: item.ports | length > 0 and item.node_name | length > 0
      loop_control:
        label: "{{ item.node_name }}"

    - name: Note that no data ports were named
      ansible.builtin.debug:
        msg: No data ports were named, so End leaves flow control unchanged.
      when: port_plan | default([]) | length == 0

    - name: Stop when no data ports were named
      when: port_plan | default([]) | length == 0
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Read flow control on the data ports
      netapp.ontap.na_ontap_rest_cli:
        command: "network/port/objects/{{ item.0.node_name }}/{{ item.1 }}"
        verb: GET
        params:
          fields: flowcontrol-admin
      loop: "{{ port_plan | subelements('ports') }}"
      loop_control:
        label: "{{ item.0.node_name }}/{{ item.1 }}"
      register: port_show

    - name: Select ports whose flow control is none
      ansible.builtin.set_fact:
        ports_to_restore: "{{ ports_to_restore | default([]) + [row] }}"
      vars:
        port_record: >-
          {{
            (item.msg.records | default([item.msg | default({})]))
            | first
            | default({})
          }}
        flow_value: >-
          {{
            port_record.flowcontrol_admin
            | default(port_record['flowcontrol-admin'] | default(''))
            | string
            | trim
            | lower
          }}
        row:
          node_name: "{{ item.item.0.node_name }}"
          port: "{{ item.item.1 }}"
      loop: "{{ port_show.results }}"
      when: flow_value == 'none'
      loop_control:
        label: "{{ item.item.0.node_name }}/{{ item.item.1 }}"

    - name: Note that flow control is no longer none
      ansible.builtin.debug:
        msg: No named data port still has flow control set to none, so End leaves the ports unchanged.
      when: ports_to_restore | default([]) | length == 0

    - name: Stop when flow control is no longer none
      when: ports_to_restore | default([]) | length == 0
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Set flow control to full
      netapp.ontap.na_ontap_rest_cli:
        command: "network/port/objects/{{ item.node_name }}/{{ item.port }}"
        verb: PATCH
        body:
          flowcontrol-admin: full
      loop: "{{ ports_to_restore }}"
      loop_control:
        label: "{{ item.node_name }}/{{ item.port }}"

    - name: Report the ports
      ansible.builtin.debug:
        msg: "Set flow control to full on {{ ports_to_restore | length }} data port(s)."
