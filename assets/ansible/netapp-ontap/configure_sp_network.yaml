---
- name: Configure ONTAP service-processor network interfaces
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    node_rows: >-
      {{
        (node_specs | from_json)
        if node_specs is string
        else node_specs
      }}

  tasks:

    - name: Normalize node rows
      ansible.builtin.set_fact:
        node_plan: "{{ node_plan | default([]) + [normalized_row] }}"
      vars:
        normalized_row:
          node_name: "{{ item.node_name | default(item['Node Name'], true) | default('', true) | trim }}"
          ip: "{{ item.ip | default(item['SP IP'], true) | default('', true) | trim }}"
          mask: "{{ item.mask | default(item['SP Netmask'], true) | default('', true) | trim }}"
          gateway: "{{ item.gateway | default(item['SP Gateway'], true) | default('', true) | trim }}"
      loop: "{{ node_rows }}"
      loop_control:
        label: "{{ item.node_name | default(item['Node Name'], true) | default('unnamed row', true) }}"

    - name: Validate node names
      ansible.builtin.assert:
        that:
          - node_plan | length > 0
          - item.node_name | length > 0
        fail_msg: >-
          Row {{ ansible_loop.index }} needs a node name.
      loop: "{{ node_plan }}"
      loop_control:
        extended: true
        label: "{{ item.node_name | default('row ' ~ ansible_loop.index) }}"

    - name: Validate that each node appears once
      ansible.builtin.assert:
        that:
          - node_plan | map(attribute='node_name') | unique | list | length == node_plan | length
        fail_msg: >-
          Each node name can appear only once. Requested names:
          {{ node_plan | map(attribute='node_name') | join(', ') }}.

    - name: Select service-processor rows
      ansible.builtin.set_fact:
        sp_plan: "{{ sp_plan | default([]) + [item] }}"
      loop: "{{ node_plan }}"
      when: item.ip | length > 0 or item.mask | length > 0 or item.gateway | length > 0
      loop_control:
        label: "{{ item.node_name }}"

    - name: Validate service-processor rows
      ansible.builtin.assert:
        that:
          - item.ip | length > 0
          - item.mask | length > 0
          - item.gateway | length > 0
        fail_msg: >-
          {{ item.node_name }} needs an SP IP, SP netmask, and SP gateway.
      loop: "{{ sp_plan | default([]) }}"
      loop_control:
        label: "{{ item.node_name }}"

    - name: Note that no service-processor address was provided
      ansible.builtin.debug:
        msg: No service-processor values were provided, so this step made no change.
      when: sp_plan | default([]) | length == 0

    # na_ontap_service_processor_network omits the IPv4 enabled flag on REST.
    # ONTAP then returns error 13631591. The CLI sets that flag explicitly.
    - name: Set the service-processor network interface
      netapp.ontap.na_ontap_rest_cli:
        command: system/service-processor/network
        verb: PATCH
        params:
          node: "{{ item.node_name }}"
          address-family: IPv4
        body:
          enable: "true"
          dhcp: none
          ip-address: "{{ item.ip }}"
          netmask: "{{ item.mask }}"
          gateway: "{{ item.gateway }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: "{{ sp_plan | default([]) }}"
      loop_control:
        label: "{{ item.node_name }}"
