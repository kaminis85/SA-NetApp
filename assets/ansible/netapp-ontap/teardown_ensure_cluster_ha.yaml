---
# Undo of ensure_cluster_ha.yaml: disable cluster HA on a two-node cluster
# when HA is configured. A cluster that is not two nodes is left unchanged,
# because the launch does not enable HA there. Safe to run twice.
- name: Disable ONTAP cluster HA
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_rest_info:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
      use_python_keys: true
    netapp.ontap.na_ontap_rest_cli:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
    netapp.ontap.na_ontap_cluster_ha:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false

  tasks:

    - name: Discover ONTAP cluster nodes
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - cluster/nodes
        fields:
          - name
      register: node_info

    - name: Count the nodes
      ansible.builtin.set_fact:
        node_count: >-
          {{
            node_info.ontap_info.cluster_nodes.records
            | default([])
            | length
          }}

    - name: Note that this is not a two-node cluster
      ansible.builtin.debug:
        msg: This cluster does not have two nodes, so End leaves cluster HA unchanged.
      when: node_count | int != 2

    - name: Stop when this is not a two-node cluster
      when: node_count | int != 2
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Read cluster HA
      netapp.ontap.na_ontap_rest_cli:
        command: cluster/ha
        verb: GET
        params:
          fields: configured
      register: ha_show

    - name: Record cluster HA
      ansible.builtin.set_fact:
        ha_configured: "{{ 'true' if (ha_flag | bool) else 'false' }}"
      vars:
        ha_record: >-
          {{
            (ha_show.msg.records | default([ha_show.msg | default({})]))
            | first
            | default({})
          }}
        ha_flag: "{{ ha_record.configured | default('') }}"

    - name: Note that cluster HA is already off
      ansible.builtin.debug:
        msg: Cluster HA is already off, so End leaves it unchanged.
      when: ha_configured != 'true'

    - name: Stop when cluster HA is already off
      when: ha_configured != 'true'
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Disable cluster HA
      netapp.ontap.na_ontap_cluster_ha:
        state: absent

    - name: Report that cluster HA was disabled
      ansible.builtin.debug:
        msg: Disabled cluster HA.
