---
# Undo of enable_lldp.yaml: turn LLDP off. The launch sets lldp.enable to on.
# Safe to run twice.
- name: Disable LLDP
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_rest_cli:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false

  tasks:

    - name: Read LLDP
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: GET
        params:
          option_name: lldp.enable
          fields: option-value
      register: lldp_show

    - name: Record the LLDP setting
      ansible.builtin.set_fact:
        live_value: >-
          {{
            (
              (lldp_show.msg.records | default([lldp_show.msg | default({})]) | first | default({})).option_value
              | default(
                  (lldp_show.msg.records | default([lldp_show.msg | default({})]) | first | default({}))['option-value']
                  | default('')
                )
            ) | string | trim | lower
          }}

    - name: Confirm LLDP was read
      ansible.builtin.assert:
        that:
          - live_value in ['on', 'off']
        fail_msg: >-
          Could not read lldp.enable. The cluster returned '{{ live_value }}'.

    - name: Note that LLDP is already off
      ansible.builtin.debug:
        msg: LLDP is already off, so End leaves it unchanged.
      when: live_value == 'off'

    - name: Stop when LLDP is already off
      when: live_value == 'off'
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Turn LLDP off
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: PATCH
        params:
          option_name: lldp.enable
        body:
          option_value: "off"

    - name: Read LLDP after the change
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: GET
        params:
          option_name: lldp.enable
          fields: option-value
      register: lldp_check

    - name: Confirm LLDP is off
      ansible.builtin.assert:
        that:
          - restored_value == 'off'
        fail_msg: "LLDP is '{{ restored_value }}' after End. Expected off."
      vars:
        restored_value: >-
          {{
            (
              (lldp_check.msg.records | default([lldp_check.msg | default({})]) | first | default({})).option_value
              | default(
                  (lldp_check.msg.records | default([lldp_check.msg | default({})]) | first | default({}))['option-value']
                  | default('')
                )
            ) | string | trim | lower
          }}
