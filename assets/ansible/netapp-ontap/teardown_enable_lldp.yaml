---
# Undo of enable_lldp.yaml.
# Restores the previous lldp.enable value only when this grain changed it
# and the cluster still has the value this deployment set. Safe to run twice.
- name: Restore LLDP
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (
            prior_config | string | trim
            | replace('&quot;', '"')
            | replace('&#34;', '"')
            | replace('&amp;', '&')
            | replace('&#39;', "'")
            | replace('&apos;', "'")
            | replace('&lt;', '<')
            | replace('&gt;', '>')
          )
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Note that this deployment did not change LLDP
      ansible.builtin.debug:
        msg: This deployment did not change LLDP, so End leaves it unchanged.
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Stop when LLDP was not changed
      when: not (incoming_prior.changed | default(false) | bool)
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    # option-value is not a CLI key, so a private CLI GET omits it unless fields asks for it.
    - name: Read LLDP
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: GET
        params:
          option_name: lldp.enable
          fields: option-value
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      register: lldp_show

    - name: Record the LLDP setting
      ansible.builtin.set_fact:
        live_value: >-
          {{
            (
              (lldp_show.msg.records | default([lldp_show.msg | default({})]) | first | default({})).option_value
              | default(
                  (lldp_show.msg.records | default([lldp_show.msg | default({})]) | first | default({}))['option-value']
                  | default('')
                )
            ) | string | trim | lower
          }}

    - name: Confirm LLDP was read
      ansible.builtin.assert:
        that:
          - live_value in ['on', 'off']
        fail_msg: >-
          Could not read lldp.enable. The cluster returned '{{ live_value }}'.

    - name: Note that LLDP no longer has the value this deployment set
      ansible.builtin.debug:
        msg: >-
          LLDP is '{{ live_value }}', not '{{ incoming_prior.applied }}', so End
          leaves it unchanged.
      when: live_value != (incoming_prior.applied | string)

    - name: Stop when LLDP was changed after the launch
      when: live_value != (incoming_prior.applied | string)
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Confirm the recorded LLDP value can be restored
      ansible.builtin.assert:
        that:
          - incoming_prior.previous | string in ['on', 'off']
        fail_msg: >-
          The recorded LLDP value '{{ incoming_prior.previous | default('') }}'
          cannot be restored.

    - name: Restore LLDP
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: PATCH
        params:
          option_name: lldp.enable
        body:
          option_value: "{{ incoming_prior.previous }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false

    - name: Read LLDP after the restore
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: GET
        params:
          option_name: lldp.enable
          fields: option-value
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      register: lldp_check

    - name: Confirm LLDP was restored
      ansible.builtin.assert:
        that:
          - restored_value == (incoming_prior.previous | string)
        fail_msg: >-
          LLDP is '{{ restored_value }}' after the restore. Expected
          '{{ incoming_prior.previous }}'.
      vars:
        restored_value: >-
          {{
            (
              (lldp_check.msg.records | default([lldp_check.msg | default({})]) | first | default({})).option_value
              | default(
                  (lldp_check.msg.records | default([lldp_check.msg | default({})]) | first | default({}))['option-value']
                  | default('')
                )
            ) | string | trim | lower
          }}
