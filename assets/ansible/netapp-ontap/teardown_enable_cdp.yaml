---
# Undo of enable_cdp.yaml: turn CDP off. The launch sets cdpd.enable to on.
# Safe to run twice.
- name: Disable CDP
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_rest_cli:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false

  tasks:

    - name: Read CDP
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: GET
        params:
          option_name: cdpd.enable
          fields: option-value
      register: cdp_show

    - name: Record the CDP setting
      ansible.builtin.set_fact:
        live_value: >-
          {{
            (
              (cdp_show.msg.records | default([cdp_show.msg | default({})]) | first | default({})).option_value
              | default(
                  (cdp_show.msg.records | default([cdp_show.msg | default({})]) | first | default({}))['option-value']
                  | default('')
                )
            ) | string | trim | lower
          }}

    - name: Confirm CDP was read
      ansible.builtin.assert:
        that:
          - live_value in ['on', 'off']
        fail_msg: >-
          Could not read cdpd.enable. The cluster returned '{{ live_value }}'.

    - name: Note that CDP is already off
      ansible.builtin.debug:
        msg: CDP is already off, so End leaves it unchanged.
      when: live_value == 'off'

    - name: Stop when CDP is already off
      when: live_value == 'off'
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Turn CDP off
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: PATCH
        params:
          option_name: cdpd.enable
        body:
          option_value: "off"

    - name: Read CDP after the change
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: GET
        params:
          option_name: cdpd.enable
          fields: option-value
      register: cdp_check

    - name: Confirm CDP is off
      ansible.builtin.assert:
        that:
          - restored_value == 'off'
        fail_msg: "CDP is '{{ restored_value }}' after End. Expected off."
      vars:
        restored_value: >-
          {{
            (
              (cdp_check.msg.records | default([cdp_check.msg | default({})]) | first | default({})).option_value
              | default(
                  (cdp_check.msg.records | default([cdp_check.msg | default({})]) | first | default({}))['option-value']
                  | default('')
                )
            ) | string | trim | lower
          }}
