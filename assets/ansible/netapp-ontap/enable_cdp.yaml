---
- name: Enable CDP on the ONTAP nodes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (
            prior_config | string | trim
            | replace('&quot;', '"')
            | replace('&#34;', '"')
            | replace('&amp;', '&')
            | replace('&#39;', "'")
            | replace('&apos;', "'")
            | replace('&lt;', '<')
            | replace('&gt;', '>')
          )
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    # option-value is not a CLI key, so a private CLI GET omits it unless fields asks for it.
    - name: Read CDP
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: GET
        params:
          option_name: cdpd.enable
          fields: option-value
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      register: cdp_show

    - name: Record the CDP setting
      ansible.builtin.set_fact:
        cdp_record: >-
          {{
            (cdp_show.msg.records | default([cdp_show.msg | default({})]))
            | first
            | default({})
          }}
        live_value: >-
          {{
            (
              (cdp_show.msg.records | default([cdp_show.msg | default({})]) | first | default({})).option_value
              | default(
                  (cdp_show.msg.records | default([cdp_show.msg | default({})]) | first | default({}))['option-value']
                  | default('')
                )
            ) | string | trim | lower
          }}
        applied_value: "on"

    - name: Confirm CDP was read
      ansible.builtin.assert:
        that:
          - live_value in ['on', 'off']
        fail_msg: >-
          Could not read cdpd.enable. The cluster returned '{{ live_value }}'.

    - name: Record whether CDP still needs to change
      ansible.builtin.set_fact:
        changed_now: "{{ live_value != applied_value }}"
        keep_original: >-
          {{
            (incoming_prior.changed | default(false) | bool)
            and (
              (live_value != applied_value)
              or (
                (incoming_prior.applied is defined)
                and (live_value == incoming_prior.applied)
              )
            )
          }}

    - name: Enable CDP on the storage controller nodes
      netapp.ontap.na_ontap_rest_cli:
        command: options
        verb: PATCH
        params:
          option_name: cdpd.enable
        body:
          option_value: "on"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false

    - name: Keep the earlier CDP value when this launch did not find a new change
      ansible.builtin.set_fact:
        prior_export:
          changed: true
          previous: "{{ incoming_prior.previous }}"
          applied: "{{ applied_value }}"
      when: keep_original | bool

    - name: Record the CDP value from this launch
      ansible.builtin.set_fact:
        prior_export:
          changed: "{{ changed_now | bool }}"
          previous: "{{ live_value }}"
          applied: "{{ applied_value }}"
      when: not (keep_original | bool)

    - name: Export the recorded CDP change
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ prior_export | to_json }}"
