---
# Undo of configure_svm_dns.yaml: remove DNS from the SVM.
# The default route is deleted after this, because configure_svm_dns depends
# on configure_svm_default_route. Safe to run twice.
- name: Delete SVM DNS
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_dns:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
    netapp.ontap.na_ontap_rest_info:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
      use_python_keys: true
  vars:
    svm_name_normalized: "{{ svm_name | default('') | string | trim }}"
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (prior_config | string | trim)
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Note that this deployment did not change SVM DNS
      ansible.builtin.debug:
        msg: This deployment did not change SVM DNS, so End leaves it unchanged.
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Stop when this deployment did not change SVM DNS
      ansible.builtin.meta: end_play
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Use the SVM whose DNS this deployment changed
      ansible.builtin.set_fact:
        svm_name_normalized: "{{ incoming_prior.applied.svm | default(svm_name_normalized) }}"

    - name: Note that the SVM name is blank
      ansible.builtin.debug:
        msg: The SVM name is blank, so SVM DNS was not deleted.
      when: svm_name_normalized | length == 0

    - name: Stop when the SVM name is blank
      ansible.builtin.meta: end_play
      when: svm_name_normalized | length == 0

    - name: Validate the SVM name
      ansible.builtin.assert:
        that:
          - svm_name_normalized is match('^[A-Za-z_][A-Za-z0-9_.-]{0,40}$')
        fail_msg: >-
          SVM name must start with a letter or underscore, contain only
          letters, numbers, underscores, hyphens, and periods, and be at most
          41 characters.

    - name: Read the SVM
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - svm/svms
        parameters:
          name: "{{ svm_name_normalized }}"
        fields:
          - name
      register: svm_lookup
      failed_when: false

    - name: Confirm the SVM lookup succeeded
      ansible.builtin.assert:
        that:
          - not (svm_lookup.failed | default(false))
        fail_msg: >-
          Could not read SVM {{ svm_name_normalized }}:
          {{ svm_lookup.msg | default('') }}

    - name: Record whether the SVM is present
      ansible.builtin.set_fact:
        svm_is_present: >-
          {{
            (
              ((svm_lookup.ontap_info | default({})).svm_svms | default({})).records
              | default([])
              | selectattr('name', 'equalto', svm_name_normalized)
              | list
              | length
            ) > 0
          }}

    - name: Note that the SVM is already gone
      ansible.builtin.debug:
        msg: >-
          SVM {{ svm_name_normalized }} is already gone, so its DNS configuration
          is already gone.
      when: not (svm_is_present | bool)

    - name: Stop when the SVM is already gone
      ansible.builtin.meta: end_play
      when: not (svm_is_present | bool)

    - name: Read SVM DNS
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - name-services/dns
        parameters:
          svm.name: "{{ svm_name_normalized }}"
        fields:
          - svm
          - servers
          - domains
      register: dns_info

    - name: Record SVM DNS
      ansible.builtin.set_fact:
        live_value:
          svm: "{{ svm_name_normalized }}"
          present: "{{ 'true' if ((dns_record.svm | default({})).name | default('') | string | length > 0) else 'false' }}"
          servers: "{{ dns_servers_live | sort }}"
          domains: "{{ dns_domains_live | sort }}"
      vars:
        dns_records: "{{ (dns_info.ontap_info.name_services_dns | default({})).records | default([]) }}"
        dns_record: >-
          {{
            (
              dns_records
              | selectattr('svm.name', 'defined')
              | selectattr('svm.name', 'equalto', svm_name_normalized)
              | list
              | first
            ) | default({})
          }}
        dns_servers_live: >-
          {{
            dns_record.servers
            | default([])
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | list
          }}
        dns_domains_live: >-
          {{
            dns_record.domains
            | default([])
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | list
          }}

    - name: Note that SVM DNS no longer matches this deployment
      ansible.builtin.debug:
        msg: SVM DNS no longer matches this deployment, so End leaves it unchanged.
      when: live_value != incoming_prior.applied

    - name: Stop when SVM DNS was changed after the launch
      ansible.builtin.meta: end_play
      when: live_value != incoming_prior.applied

    - name: Delete SVM DNS
      netapp.ontap.na_ontap_dns:
        state: absent
        vserver: "{{ svm_name_normalized }}"
      when: (incoming_prior.previous.present | default('true') | string) == 'false'

    - name: Restore the previous SVM DNS configuration
      netapp.ontap.na_ontap_dns:
        state: present
        vserver: "{{ svm_name_normalized }}"
        nameservers: "{{ incoming_prior.previous.servers }}"
        domains: "{{ incoming_prior.previous.domains }}"
      when: (incoming_prior.previous.present | default('true') | string) == 'true'

    - name: Report the restored SVM DNS
      ansible.builtin.debug:
        msg: >-
          {{
            'Deleted SVM DNS.'
            if ((incoming_prior.previous.present | default('true') | string) == 'false')
            else 'Restored the previous SVM DNS configuration.'
          }}
