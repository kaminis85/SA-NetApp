# The SVM default route runs only after the management LIF is created.
# svm_mgmt_lif_gateway is checked just before the route is created.
# A blank gateway skips this task. Skipping the LIF skips the route as well.
- name: Create the SVM default route
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    svm_name_normalized: "{{ svm_name | default('') | string | trim }}"
    svm_mgmt_lif_address_normalized: "{{ svm_mgmt_lif_address | default('') | string | trim }}"
    svm_mgmt_lif_gateway_normalized: "{{ svm_mgmt_lif_gateway | default('') | string | trim }}"
    ipv4_pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (prior_config | string | trim)
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Validate the SVM name
      ansible.builtin.assert:
        that:
          - svm_name_normalized is match('^[A-Za-z_][A-Za-z0-9_.-]{0,40}$')
        fail_msg: >-
          SVM name must start with a letter or underscore, contain only
          letters, numbers, underscores, hyphens, and periods, and be at most
          41 characters.

    - name: Validate svm_mgmt_lif_gateway
      ansible.builtin.assert:
        that:
          - svm_mgmt_lif_gateway_normalized is match(ipv4_pattern)
        fail_msg: svm_mgmt_lif_gateway must be an IPv4 address.

    - name: Validate that svm_mgmt_lif_address and svm_mgmt_lif_gateway differ
      ansible.builtin.assert:
        that:
          - svm_mgmt_lif_address_normalized != svm_mgmt_lif_gateway_normalized
        fail_msg: svm_mgmt_lif_address and svm_mgmt_lif_gateway must be different.

    - name: Show the SVM default route plan
      ansible.builtin.debug:
        msg: >-
          The SVM default route to 0.0.0.0/0 will use gateway
          {{ svm_mgmt_lif_gateway_normalized }}.

    - name: Read SVM routes
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - network/ip/routes
        parameters:
          svm.name: "{{ svm_name_normalized }}"
        fields:
          - svm
          - destination
          - gateway
      register: route_info

    - name: Record a default route that is already present
      ansible.builtin.set_fact:
        default_route_present: true
      vars:
        destination_text: >-
          {{
            (
              (item.destination.address | default(''))
              if (item.destination is mapping)
              else (item.destination | default('') | string)
            ) | string
          }}
      loop: "{{ ((route_info.ontap_info | default({})).network_ip_routes | default({})).records | default([]) }}"
      when: destination_text is match('^0\\.0\\.0\\.0')
      loop_control:
        label: "{{ destination_text | default('route') }}"

    - name: Record the default route when it is not already present
      ansible.builtin.set_fact:
        added_now:
          - id: "{{ svm_name_normalized }}/0.0.0.0/0"
            svm: "{{ svm_name_normalized }}"
            gateway: "{{ svm_mgmt_lif_gateway_normalized }}"
      when: not (default_route_present | default(false) | bool)

    - name: Create the default route on the SVM
      netapp.ontap.na_ontap_net_routes:
        state: present
        vserver: "{{ svm_name_normalized }}"
        destination: 0.0.0.0/0
        gateway: "{{ svm_mgmt_lif_gateway_normalized }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always

    - name: Keep routes this deployment already created
      ansible.builtin.set_fact:
        added_objects: "{{ incoming_prior.added | default([]) }}"
      when: incoming_prior.changed | default(false) | bool

    - name: Start a new route list when this deployment has not created one
      ansible.builtin.set_fact:
        added_objects: []
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Add the default route when it was not already on the cluster
      ansible.builtin.set_fact:
        added_objects: "{{ added_objects + [item] }}"
      loop: "{{ added_now | default([]) }}"
      when: item.id not in (added_objects | map(attribute='id') | list)

    - name: Export the routes this deployment created
      torque.collections.export_torque_outputs:
        outputs:
          prior_config: "{{ {'changed': (added_objects | length > 0), 'added': added_objects} | to_json }}"
