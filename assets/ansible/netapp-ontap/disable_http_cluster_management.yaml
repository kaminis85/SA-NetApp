---
- name: Disable HTTP cluster management access
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # The cluster default-management policy is cluster-scoped in the Default
    # IPspace. Read the public REST object because private CLI show output
    # does not include the service list unless fields are requested explicitly.
    - name: Get the default-management service policy and its services
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - network/ip/service-policies
        fields:
          - name
          - services
          - scope
          - ipspace.name
        parameters:
          name: default-management
          scope: cluster
          ipspace.name: Default
      register: policy_show
      no_log: true

    - name: Validate the default-management policy
      ansible.builtin.assert:
        that:
          - default_management_policies | length == 1
        fail_msg: The cluster did not return the default-management service policy for this cluster name.
      vars:
        default_management_policies: >-
          {{
            policy_show.ontap_info.network_ip_service_policies.records
            | default([])
            | selectattr('name', 'equalto', 'default-management')
            | selectattr('scope', 'equalto', 'cluster')
            | selectattr('ipspace.name', 'equalto', 'Default')
            | list
          }}

    - name: Record the default-management service policy
      ansible.builtin.set_fact:
        default_management_policy: >-
          {{
            (
              policy_show.ontap_info.network_ip_service_policies.records
              | default([])
              | selectattr('name', 'equalto', 'default-management')
              | selectattr('scope', 'equalto', 'cluster')
              | selectattr('ipspace.name', 'equalto', 'Default')
              | list
            )[0]
          }}

    - name: Record whether HTTP management is enabled
      ansible.builtin.set_fact:
        http_management_enabled: >-
          {{
            'management-http' in (default_management_policy.services | default([]))
            or 'management_http' in (default_management_policy.services | default([]))
          }}

    - name: Validate the cluster name
      ansible.builtin.assert:
        that:
          - cluster_name | default('') | length > 0
        fail_msg: Provide cluster_name.
      when: http_management_enabled | bool

    - name: Remove HTTP from the default-management service policy
      netapp.ontap.na_ontap_rest_cli:
        command: network/interface/service-policy/remove-service
        verb: DELETE
        params:
          vserver: "{{ cluster_name }}"
          policy: default-management
          service: management-http
          privilege_level: advanced
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      when: http_management_enabled | bool

    - name: Report that HTTP cluster management is already disabled
      ansible.builtin.debug:
        msg: HTTP cluster management is already disabled.
      when: not (http_management_enabled | bool)
