---
# Undo of configure_ntp.yaml.
# Deletes only NTP servers this deployment added. Servers that were already
# on the cluster stay. Safe to run twice.
- name: Remove ONTAP NTP servers added by this deployment
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_ntp:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
    netapp.ontap.na_ontap_rest_info:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
      use_python_keys: true
  vars:
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (prior_config | string | trim)
        )
      }}

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Note that this deployment did not add NTP servers
      ansible.builtin.debug:
        msg: This deployment did not add NTP servers, so End leaves them unchanged.
      when: not (incoming_prior.changed | default(false) | bool) or (incoming_prior.added | default([]) | length == 0)

    - name: Stop when no NTP server was added
      ansible.builtin.meta: end_play
      when: not (incoming_prior.changed | default(false) | bool) or (incoming_prior.added | default([]) | length == 0)

    - name: Read NTP servers
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - cluster/ntp/servers
        fields:
          - server
      register: ntp_info

    - name: Record NTP servers that are still present
      ansible.builtin.set_fact:
        servers_to_delete: "{{ servers_to_delete | default([]) + [item] }}"
      vars:
        existing_servers: >-
          {{
            (ntp_info.ontap_info.cluster_ntp_servers | default({})).records
            | default([])
            | map(attribute='server')
            | map('string')
            | map('trim')
            | list
          }}
      loop: "{{ incoming_prior.added }}"
      when: item in existing_servers

    - name: Note that the added NTP servers are already gone
      ansible.builtin.debug:
        msg: The NTP servers added by this deployment are already gone.
      when: servers_to_delete | default([]) | length == 0

    - name: Stop when the added NTP servers are already gone
      ansible.builtin.meta: end_play
      when: servers_to_delete | default([]) | length == 0

    - name: Delete NTP servers added by this deployment
      netapp.ontap.na_ontap_ntp:
        state: absent
        server_name: "{{ item }}"
      loop: "{{ servers_to_delete }}"
      loop_control:
        label: "{{ item }}"

    - name: Report the deleted NTP servers
      ansible.builtin.debug:
        msg: "Deleted NTP servers {{ servers_to_delete | join(', ') }}."
