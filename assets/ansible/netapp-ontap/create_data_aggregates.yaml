---
- name: Create and verify ONTAP data aggregates
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    node_rows: >-
      {{
        (node_specs | from_json)
        if node_specs is string
        else node_specs
      }}
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (prior_config | string | trim)
        )
      }}

  tasks:
    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Normalize node rows
      ansible.builtin.set_fact:
        node_plan: "{{ node_plan | default([]) + [normalized_row] }}"
      vars:
        normalized_row:
          node_name: "{{ item.node_name | default(item['Node Name'], true) | default('', true) | trim }}"
          aggregate_name: "{{ item.aggregate_name | default(item['Aggregate Name'], true) | default('', true) | trim }}"
          disk_count: "{{ item.disk_count | default(item['Disk Count'], true) | default('', true) | string | trim }}"
      loop: "{{ node_rows }}"
      loop_control:
        label: "{{ item.node_name | default(item['Node Name'], true) | default('unnamed row', true) }}"

    - name: Select aggregate rows
      ansible.builtin.set_fact:
        aggregate_plan: "{{ aggregate_plan | default([]) + [item] }}"
      loop: "{{ node_plan }}"
      when: item.aggregate_name | length > 0 or item.disk_count | length > 0
      loop_control:
        label: "{{ item.node_name }}"

    - name: Keep the earlier aggregate record when none were requested
      torque.collections.export_torque_outputs:
        outputs:
          aggregate_status: No aggregate was requested, so this step made no change.
          prior_config: "{{ incoming_prior | to_json }}"
      when:
        - aggregate_plan | default([]) | length == 0
        - incoming_prior.changed | default(false) | bool

    - name: Record that no aggregate was changed
      torque.collections.export_torque_outputs:
        outputs:
          aggregate_status: No aggregate was requested, so this step made no change.
          prior_config: "{{ {'changed': false} | to_json }}"
      when:
        - aggregate_plan | default([]) | length == 0
        - not (incoming_prior.changed | default(false) | bool)

    - name: Stop when no aggregate was requested
      ansible.builtin.meta: end_play
      when: aggregate_plan | default([]) | length == 0

    - name: Validate node names
      ansible.builtin.assert:
        that:
          - item.node_name | length > 0
        fail_msg: >-
          Row {{ ansible_loop.index }} needs a node name.
      loop: "{{ node_plan }}"
      when: item.aggregate_name | length > 0 or item.disk_count | length > 0
      loop_control:
        extended: true
        label: "{{ item.node_name | default('row ' ~ ansible_loop.index) }}"

    - name: Validate that each node appears once
      ansible.builtin.assert:
        that:
          - aggregate_plan | map(attribute='node_name') | unique | list | length == aggregate_plan | length
        fail_msg: >-
          Each node name can appear only once. One row configures one node and
          one aggregate. Requested names:
          {{ aggregate_plan | map(attribute='node_name') | join(', ') }}.

    - name: Validate each requested aggregate
      ansible.builtin.assert:
        that:
          - item.aggregate_name | length > 0
          - item.disk_count | length > 0
          - item.disk_count | int > 0
        fail_msg: >-
          {{ item.node_name }} needs an aggregate name and a disk count above zero.
      loop: "{{ aggregate_plan }}"
      loop_control:
        label: "{{ item.node_name }}"

    - name: Validate that aggregate names are unique
      ansible.builtin.assert:
        that:
          - aggregate_plan | map(attribute='aggregate_name') | unique | list | length == aggregate_plan | length
        fail_msg: >-
          Aggregate names must be unique. Requested names:
          {{ aggregate_plan | map(attribute='aggregate_name') | join(', ') }}.

    - name: Validate the discovered disk class
      ansible.builtin.assert:
        that:
          - disk_class | default('') | length > 0
        fail_msg: Aggregate creation did not receive a disk class.

    - name: Read aggregates before creating them
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - storage/aggregates
        fields:
          - name
      register: aggregates_before

    - name: Record aggregates that are not already present
      ansible.builtin.set_fact:
        added_now: "{{ added_now | default([]) + [row] }}"
      vars:
        row:
          id: "{{ item.aggregate_name }}"
          name: "{{ item.aggregate_name }}"
        existing_names: >-
          {{
            (aggregates_before.ontap_info.storage_aggregates.records | default([]))
            | map(attribute='name')
            | map('string')
            | list
          }}
      loop: "{{ aggregate_plan }}"
      when: item.aggregate_name not in existing_names
      loop_control:
        label: "{{ item.aggregate_name }}"

    - name: Create data aggregates
      netapp.ontap.na_ontap_aggregate:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        name: "{{ item.aggregate_name }}"
        disk_count: "{{ item.disk_count }}"
        nodes: "{{ item.node_name }}"
        disk_class: "{{ disk_class }}"
        https: true
        validate_certs: false
      loop: "{{ aggregate_plan }}"
      loop_control:
        label: "{{ item.aggregate_name }} on {{ item.node_name }}"

    - name: Get aggregate information for verification
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - storage/aggregates
        fields:
          - name
          - node
      register: aggregate_info
      no_log: true

    - name: Verify aggregate existence and node placement
      ansible.builtin.assert:
        that:
          - item.aggregate_name in (aggregate_info.ontap_info.storage_aggregates.records | default([]) | map(attribute='name') | list)
          - item.node_name in (aggregate_info.ontap_info.storage_aggregates.records | default([]) | selectattr('name', 'equalto', item.aggregate_name) | map(attribute='node.name') | list)
        fail_msg: >-
          Aggregate {{ item.aggregate_name }} was not found on node
          {{ item.node_name }} after creation.
        success_msg: >-
          Verified aggregate {{ item.aggregate_name }} on node
          {{ item.node_name }}.
      loop: "{{ aggregate_plan }}"
      loop_control:
        label: "{{ item.aggregate_name }} on {{ item.node_name }}"

    - name: Keep aggregates this deployment already created
      ansible.builtin.set_fact:
        added_objects: "{{ incoming_prior.added | default([]) }}"
      when: incoming_prior.changed | default(false) | bool

    - name: Start a new aggregate list when this deployment has not created one
      ansible.builtin.set_fact:
        added_objects: []
      when: not (incoming_prior.changed | default(false) | bool)

    - name: Add aggregates that were not already on the cluster
      ansible.builtin.set_fact:
        added_objects: "{{ added_objects + [item] }}"
      loop: "{{ added_now | default([]) }}"
      when: item.id not in (added_objects | map(attribute='id') | list)

    - name: Export Stack Automation outputs
      torque.collections.export_torque_outputs:
        outputs:
          aggregate_status: >-
            Created and verified {{ aggregate_plan | length }} data
            aggregate(s) on {{ ontap_hostname }}.
          prior_config: "{{ {'changed': (added_objects | length > 0), 'added': added_objects} | to_json }}"
