---
- name: Create and verify ONTAP data aggregates
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    node_rows: >-
      {{
        (node_specs | from_json)
        if node_specs is string
        else node_specs
      }}

  tasks:
    - name: Normalize node rows
      ansible.builtin.set_fact:
        node_plan: "{{ node_plan | default([]) + [normalized_row] }}"
      vars:
        normalized_row:
          node_name: "{{ item.node_name | default(item['Node Name'], true) | default('', true) | trim }}"
          aggregate_name: "{{ item.aggregate_name | default(item['Aggregate Name'], true) | default('', true) | trim }}"
          disk_count: "{{ item.disk_count | default(item['Disk Count'], true) | default('', true) | string | trim }}"
      loop: "{{ node_rows }}"
      loop_control:
        label: "{{ item.node_name | default(item['Node Name'], true) | default('unnamed row', true) }}"

    - name: Validate node names
      ansible.builtin.assert:
        that:
          - node_plan | length > 0
          - item.node_name | length > 0
        fail_msg: >-
          Row {{ ansible_loop.index }} needs a node name.
      loop: "{{ node_plan }}"
      loop_control:
        extended: true
        label: "{{ item.node_name | default('row ' ~ ansible_loop.index) }}"

    - name: Validate that each node appears once
      ansible.builtin.assert:
        that:
          - node_plan | map(attribute='node_name') | unique | list | length == node_plan | length
        fail_msg: >-
          Each node name can appear only once. One row configures one node and
          one aggregate. Requested names:
          {{ node_plan | map(attribute='node_name') | join(', ') }}.

    - name: Select aggregate rows
      ansible.builtin.set_fact:
        aggregate_plan: "{{ aggregate_plan | default([]) + [item] }}"
      loop: "{{ node_plan }}"
      when: item.aggregate_name | length > 0 or item.disk_count | length > 0
      loop_control:
        label: "{{ item.node_name }}"

    - name: Validate each requested aggregate
      ansible.builtin.assert:
        that:
          - item.aggregate_name | length > 0
          - item.disk_count | length > 0
          - item.disk_count | int > 0
        fail_msg: >-
          {{ item.node_name }} needs an aggregate name and a disk count above zero.
      loop: "{{ aggregate_plan | default([]) }}"
      loop_control:
        label: "{{ item.node_name }}"

    - name: Validate that aggregate names are unique
      ansible.builtin.assert:
        that:
          - aggregate_plan | default([]) | map(attribute='aggregate_name') | unique | list | length == aggregate_plan | default([]) | length
        fail_msg: >-
          Aggregate names must be unique. Requested names:
          {{ aggregate_plan | default([]) | map(attribute='aggregate_name') | join(', ') }}.
      when: aggregate_plan | default([]) | length > 0

    - name: Export skipped aggregate status
      torque.collections.export_torque_outputs:
        outputs:
          aggregate_status: No aggregate was requested, so this step made no change.
      when: aggregate_plan | default([]) | length == 0

    - name: Stop when no aggregate was requested
      ansible.builtin.meta: end_play
      when: aggregate_plan | default([]) | length == 0

    - name: Validate the discovered disk class
      ansible.builtin.assert:
        that:
          - disk_class | default('') | length > 0
        fail_msg: Aggregate creation did not receive a disk class.

    - name: Create data aggregates
      netapp.ontap.na_ontap_aggregate:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        name: "{{ item.aggregate_name }}"
        disk_count: "{{ item.disk_count }}"
        nodes: "{{ item.node_name }}"
        disk_class: "{{ disk_class }}"
        https: true
        validate_certs: false
      loop: "{{ aggregate_plan }}"
      loop_control:
        label: "{{ item.aggregate_name }} on {{ item.node_name }}"

    - name: Get aggregate information for verification
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - storage/aggregates
        fields:
          - name
          - node
      register: aggregate_info
      no_log: true

    - name: Verify aggregate existence and node placement
      ansible.builtin.assert:
        that:
          - item.aggregate_name in (aggregate_info.ontap_info.storage_aggregates.records | default([]) | map(attribute='name') | list)
          - item.node_name in (aggregate_info.ontap_info.storage_aggregates.records | default([]) | selectattr('name', 'equalto', item.aggregate_name) | map(attribute='node.name') | list)
        fail_msg: >-
          Aggregate {{ item.aggregate_name }} was not found on node
          {{ item.node_name }} after creation.
        success_msg: >-
          Verified aggregate {{ item.aggregate_name }} on node
          {{ item.node_name }}.
      loop: "{{ aggregate_plan }}"
      loop_control:
        label: "{{ item.aggregate_name }} on {{ item.node_name }}"

    - name: Export Stack Automation outputs
      torque.collections.export_torque_outputs:
        outputs:
          aggregate_status: >-
            Created and verified {{ aggregate_plan | length }} data
            aggregate(s) on {{ ontap_hostname }}.
