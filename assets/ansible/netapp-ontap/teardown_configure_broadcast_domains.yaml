---
# Undo of configure_broadcast_domains.yaml: delete the broadcast domains
# this deployment created for in-band management, NFS, and the two iSCSI VLANs.
# VLAN interfaces are already gone, because that grain depends on this one.
# The IPspace is deleted after this. Default and Cluster are never deleted.
# Safe to run twice.
- name: Delete ONTAP broadcast domains
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    netapp.ontap.na_ontap_broadcast_domain:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
    netapp.ontap.na_ontap_rest_info:
      hostname: "{{ ontap_hostname }}"
      username: "{{ ontap_username }}"
      password: "{{ ontap_password }}"
      https: true
      validate_certs: false
      use_rest: always
      use_python_keys: true
  vars:
    ipspace_name_normalized: "{{ ipspace_name | default('') | string | trim }}"
    prior_config_text: >-
      {{
        ''
        if (prior_config | default('') | string | trim) in ['', '<no value>', 'None', 'null', 'undefined']
        else (
          prior_config
          if prior_config is mapping
          else (
            prior_config | string | trim
            | replace('&quot;', '"')
            | replace('&#34;', '"')
            | replace('&amp;', '&')
            | replace('&#39;', "'")
            | replace('&apos;', "'")
            | replace('&lt;', '<')
            | replace('&gt;', '>')
          )
        )
      }}
    network_inputs:
      - role: In-band management
        name: "{{ ib_mgmt_vlan_name | default('') | string | trim }}"
      - role: NFS
        name: "{{ nfs_vlan_name | default('') | string | trim }}"
      - role: iSCSI-A
        name: "{{ iscsi_a_vlan_name | default('') | string | trim }}"
      - role: iSCSI-B
        name: "{{ iscsi_b_vlan_name | default('') | string | trim }}"

  tasks:

    - name: Read the change recorded by the last launch
      ansible.builtin.set_fact:
        incoming_prior: "{{ prior_config_text if prior_config_text is mapping else (prior_config_text | from_json) }}"
      when: prior_config_text is mapping or prior_config_text | length > 0

    - name: Use an empty record when this grain has no earlier change
      ansible.builtin.set_fact:
        incoming_prior:
          changed: false
      when: not (prior_config_text is mapping) and (prior_config_text | length == 0)

    - name: Note that this deployment did not create a broadcast domain
      ansible.builtin.debug:
        msg: This deployment did not create a broadcast domain, so End leaves them unchanged.
      when: >-
        not (incoming_prior.changed | default(false) | bool)
        or (incoming_prior.added | default([]) | length == 0)

    - name: Stop when this deployment did not create a broadcast domain
      when: >-
        not (incoming_prior.changed | default(false) | bool)
        or (incoming_prior.added | default([]) | length == 0)
      block:
        - name: Stop the play
          ansible.builtin.meta: end_play

    - name: Use the broadcast domains this deployment created
      ansible.builtin.set_fact:
        vlan_plan: "{{ incoming_prior.added }}"
        ipspace_name_normalized: "{{ (incoming_prior.added | first).ipspace }}"

    - name: Validate the IPspace name
      ansible.builtin.assert:
        that:
          - ipspace_name_normalized | length > 0
          - ipspace_name_normalized is match('^[A-Za-z_][A-Za-z0-9_.-]{0,63}$')
          - ipspace_name_normalized | lower not in ['default', 'cluster']
        fail_msg: >-
          Broadcast domains are deleted from the IPspace. Enter a name that
          starts with a letter or underscore. Default and Cluster already
          exist and cannot be used here.

    - name: Validate VLAN names
      ansible.builtin.assert:
        that:
          - item.name is match('^[A-Za-z_][A-Za-z0-9_.-]{0,63}$')
          - item.name | lower not in ['default', 'cluster']
        fail_msg: >-
          {{ item.role }} VLAN name must start with a letter or underscore and
          contain only letters, numbers, underscores, hyphens, and periods.
          Default and Cluster are reserved.
      loop: "{{ vlan_plan }}"
      loop_control:
        label: "{{ item.role }}"

    - name: Delete the broadcast domains
      netapp.ontap.na_ontap_broadcast_domain:
        state: absent
        name: "{{ item.name }}"
        ipspace: "{{ item.ipspace }}"
      loop: "{{ vlan_plan }}"
      loop_control:
        label: "{{ item.role }} {{ item.name }}"
      register: domain_delete
      failed_when: false

    - name: Confirm the broadcast domains were deleted
      ansible.builtin.assert:
        that:
          - not (item.failed | default(false))
        fail_msg: >-
          Deleting broadcast domain {{ item.item.name }} failed:
          {{ item.msg | default('') }}
        success_msg: "Broadcast domain {{ item.item.name }} delete accepted"
      loop: "{{ domain_delete.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Wait until the broadcast domains are gone
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - network/ethernet/broadcast-domains
        fields:
          - name
          - ipspace
      register: domain_check
      failed_when: false
      until: >-
        not (domain_check.failed | default(false)) and (
          (
            ((domain_check.ontap_info | default({})).network_ethernet_broadcast_domains | default({})).records
            | default([])
            | map(attribute='name')
            | list
          ) | intersect(vlan_plan | map(attribute='name') | list) | length
        ) == 0
      retries: 20
      delay: 10

    - name: Confirm the broadcast domains are gone
      ansible.builtin.assert:
        that:
          - not (domain_check.failed | default(false))
          - (
              (
                ((domain_check.ontap_info | default({})).network_ethernet_broadcast_domains | default({})).records
                | default([])
                | map(attribute='name')
                | list
              ) | intersect(vlan_plan | map(attribute='name') | list) | length
            ) == 0
        fail_msg: >-
          A broadcast domain is still present after the delete.
          {{ domain_check.msg | default('') }}
        success_msg: "Broadcast domains are gone"
